search_2026_11_07: >-
  Re-checked the TowerPro datasheet and the Components101 MG996R drawing (research/servo_dl/). Both show the same
  outline-only drawing: body 36.6 tall, tab underside 26.6 above the base (so 10.0 below the case top), 47.6 overall
  with a CROSS horn fitted (horn top 11.0 above the case top), body 40.3 / 53.6 over the tabs, 20 wide. Neither gives
  tab-hole spacing, hole size, shaft position from the body end, or round-horn height / screw circle. A KPower
  standard-servo table gives 49.5 +-0.3 hole spacing as a class value (not MG996R-specific). The selected listing is a
  Miuzei MG996R (clone, no published drawing); round-horn listings for 25T MG996R horns range 20-24.5 mm with 14-16.5
  mm hole spacing, so the horn depends on what is in the box.
note: Built by the main agent (the model-finder lost shell access). Measure one servo with calipers before printing the upper shank and gripper base (tab hole spacing x/y, shaft offset from body end, tab top below the top face); window clearance is 0.4 per side. Horn (Ø21 x 5.5) is an estimate of the round horn in the box.
