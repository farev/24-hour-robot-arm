- id: dupont-jumpers
  name: Jumper wires (your stock)
  function: Signal and power wiring, servo lead extension
  status: owned
  qty: 1
  image: parts/images/dupont-jumpers.jpg
  specs: [M-M / M-F / F-F jumpers]
  compat: unverified
  in_cad: false
  note: >-
    You have these (answer of 2026-11-05). Uses: yaw switch to D11; servo signal to A3 (chain M-F jumpers to
    cover the ~73 cm path); 24 V to the buck input (short run in the base, ~0.7 A at servo stall, est).
    Servo 6 V power over ~73 cm: chained single jumpers (~26-28 AWG) drop ~0.8 V at the 2.5 A stall (est), so
    run two jumpers in parallel for + and for - (about 0.4 V) and set the buck to 6.3 V. 22 AWG wire is better if
    you have some.
