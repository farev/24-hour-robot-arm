  - between: [M METERXITY F624ZZ flanged bearing 4x13x5 (10-pack), system]
    interface: bore, OD, flange vs printed pockets and M4 axles
    claim: "Listing: F624ZZ 4 x 13 x 5, flange 15 x 1 mm, same as parts/models/f624zz. v4 pockets: Ø13.1 x 5 deep + Ø15.4 x 1.1 flange counterbore, Ø7.6 relief behind the hub pockets, M4 bolts as axles. Press fit still to be confirmed on the fit coupon."
    evidence: [https://www.amazon.com/dp/B0F4QXCS6R, design/v4/printed/lib.py, design/v4/printed/fit_coupon.py]
    status: ok
  - between: [uxcell F624ZZ flanged bearing 4x13x5 (10 pcs), system]
    interface: bore, OD, flange vs printed pockets
    claim: "Listing: F624ZZ 4 x 13 x 5, flange Ø15; same pockets as above. Backup pick."
    evidence: [https://www.amazon.com/dp/B07Z3DB93B]
    status: ok
  - between: [uxcell F624ZZ flanged bearing 4x13x5 (10 pcs), system]
    interface: "if swapped for a plain 624ZZ (no flange): axial seat"
    claim: "Hub pockets in lower_shank, upper_shank, shoulder_compound and wrist_pulley are 5 deep onto a Ø7.6 step, so a 5 mm wide 624 seats on its outer ring at the same height as the F624 and the pair captures the part both ways. In base.py the step below each bearing has only a Ø4.8 hole, so the inner ring would rest on the fixed base, and the bottom nut would clamp it there. Open that hole to Ø7.6 before using plain 624s."
    evidence: [design/v4/printed/lower_shank.py, design/v4/printed/wrist_pulley.py, design/v4/printed/base.py]
