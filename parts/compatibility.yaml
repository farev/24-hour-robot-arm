    evidence: [firmware/arm_v4/arm_v4.ino, https://courses.ece.cornell.edu/ece5990/ECE5725_Spring2020_Projects/May_15_Demo/Smart%20Lock/W_pp445_yl656/datasheet/MG996R_Tower-Pro.pdf]
    status: unverified
  - between: [Jumper wires (your stock), MG996R metal-gear servo (2-pack)]
    interface: lead extension and power wiring
    claim: "MG996R plug is a 3-pin 2.54 mm female (JR/Futaba), so M-F Dupont jumpers plug straight in. Thin Dupont wire (~26-28 AWG) is fine for the signal; chained single jumpers drop ~0.8 V at the 2.5 A stall over the ~1.5 m loop (estimate), so the 6 V power runs on two jumpers in parallel per conductor (~0.4 V) with the buck set to 6.3 V (servo range 4.8-7.2 V)."
    evidence: [https://courses.ece.cornell.edu/ece5990/ECE5725_Spring2020_Projects/May_15_Demo/Smart%20Lock/W_pp445_yl656/datasheet/MG996R_Tower-Pro.pdf]
