checked: "2026-11-05"
checks:
  # ---------------- power
  - between: [24 V 6 A DC power supply (owned), Arduino CNC Shield V3 with A4988 drivers]
    interface: motor supply voltage
    claim: "Supply 24 V (user); A4988 VBB 8-35 V (Allegro datasheet) -> passes with 11 V margin. The shield's bulk electrolytic must be rated >= 35 V; its marking has not been read (some clones fit 25 V caps)."
    evidence: [user stated 24 V 6 A, https://www.allegromicro.com/-/media/files/datasheets/a4988-datasheet.pdf]
    status: unverified
  - between: [24 V 6 A DC power supply (owned), system]
    interface: supply current budget
    claim: "v4: 4 steppers (3 x XY42 at 1.0 A, HEM at 0.7 A) draw about 2-2.5 A from 24 V (chopper drive, estimate) + 1 gripper MG996R at 6 V, 2.5 A stall / 0.9 eff = ~0.7 A at 24 V -> ~3.2 A of the 6 A available (estimate)."
    evidence: [user stated 6 A, https://www.allegromicro.com/en/products/motor-drivers/brush-dc-motor-drivers/a4988]
    status: unverified
  - between: [XL4015 5 A buck converter (3-pack), 24 V 6 A DC power supply (owned)]
    interface: buck input range
    claim: "Listing: 4-38 V in, needs input >= output + 1.5 V; 24 V in, 6 V out passes. Listing spec table not readable (Amazon blocked)."
    evidence: https://www.amazon.com/dp/B0D1G4C28P
    status: unverified
  - between: [MG996R metal-gear servo (2-pack), XL4015 5 A buck converter (3-pack)]
    interface: servo supply
    claim: "MG996R 4.8-6.6 V, stall 2.5 A at 6 V (TowerPro datasheet); buck set to 6.3 V (covers the jumper drop), 4.5 A recommended. v4 has one servo (gripper): stall 2.5 A x 1.25 = 3.1 A, under 4.5 A. The XL4015 can output up to 36 V: set 6.3 V with a meter before connecting the servo."
    evidence: [https://courses.ece.cornell.edu/ece5990/ECE5725_Spring2020_Projects/May_15_Demo/Smart%20Lock/W_pp445_yl656/datasheet/MG996R_Tower-Pro.pdf, https://www.amazon.com/dp/B0D1G4C28P]
    status: unverified
  - between: [Inline DC push-button switch 5.5 x 2.1 mm male-female (3-pack), 24 V 6 A DC power supply (owned)]
    interface: barrel connector and current
    claim: "Switch is 5.5 x 2.1 mm push-button; its current rating is not on the listing; the supply's plug size is not confirmed (the shield pigtail looks 5.5 x 2.1 in the photo). Motor-side current ~2-3 A est."
    evidence: [https://www.amazon.com/dp/B07J2FC2X7, user photo of shield pigtail]
    status: unverified
  # ---------------- motor drive
  - between: [XYSLDJ XY42STH40-1204A NEMA 17 stepper (40 mm), Arduino CNC Shield V3 with A4988 drivers]
    interface: phase current
    claim: "v4: three XY42 on Z (yaw), Y (shoulder), X (elbow). Motor 1.2 A/phase (label); A4988 2 A max, about 1 A without a fan -> set 1.0 A. Vref = I x 8 x Rs: 0.80 V if the module's sense resistors read R100, 0.40 V if R050 (not read yet). 1.2 A (Vref 0.96 V) only with a fan on the drivers."
    evidence: [user photo of label, https://www.allegromicro.com/en/products/motor-drivers/brush-dc-motor-drivers/a4988, firmware/arm_v4/arm_v4.ino]
    status: unverified
  - between: [High Efficiency Motors HEM-17D2008-10 NEMA 17 stepper (34 mm), Arduino CNC Shield V3 with A4988 drivers]
    interface: phase current
    claim: "v4: HEM drives the wrist from socket A. Motor 0.8 A/phase (label); set 0.7 A (Vref 0.56 V with R100, 0.28 V with R050)."
    evidence: [user photo of label, https://www.allegromicro.com/en/products/motor-drivers/brush-dc-motor-drivers/a4988, firmware/arm_v4/arm_v4.ino]
    status: unverified
  - between: [Arduino Uno R3, Arduino CNC Shield V3 with A4988 drivers]
    interface: logic level and pinout
    claim: "Uno 5 V logic; A4988 logic 3-5.5 V (Allegro) -> passes. Firmware assumes the common V3 pinout (X step 2/dir 5, Y 3/6, Z 4/7, EN 8, Z limit D11, A axis on D12/D13 via the A jumpers, CoolEn A3). No pinout document for this exact clone has been read; check the silkscreen and the A-axis jumper positions on arrival."
    evidence: [https://docs.arduino.cc/hardware/uno-rev3, https://www.allegromicro.com/en/products/motor-drivers/brush-dc-motor-drivers/a4988, firmware/arm_v4/arm_v4.ino]
    status: unverified
  - between: [XYSLDJ XY42STH40-1204A NEMA 17 stepper (40 mm), system]
    interface: v4 joint torque (shoulder 14:1, elbow 7:1)
    claim: "sim/v4_check.py, CAD masses, arm straight out at the table. At 1.0 A (holding ~0.217 N·m = 0.26 x 1.0/1.2): 300 g uses 81 % shoulder / 77 % elbow; max payload inside the 50 % budget 48 g, inside 100 % of holding 447 g. At 1.2 A (0.26 N·m, fan needed): 300 g uses 67 % / 65 %, 129 g inside 50 %. Does not meet requirements.yaml (300 g at 50 %); user chose on 2026-11-05 to build as is and test on the bench (requirements.yaml payload_decision). Holding torque of the -1204A row is unpublished."
    evidence: [https://luni64.github.io/TeensyStep/applications2/901_stepper/assets/datasheet_XY42STH.pdf, sim/v4_check.py]
    status: unverified
  - between: [XYSLDJ XY42STH40-1204A NEMA 17 stepper (40 mm), system]
    interface: v4 yaw torque
    claim: "Yaw has no gravity load; 0.217 N·m x 6 = 1.3 N·m vs ~0.2 N·m to accelerate the arm at 2 rad/s² plus AXK and F624 friction (estimate)."
    evidence: [sim/v4_check.py, design/v4/geometry.py]
    status: unverified
  - between: [Arduino Uno R3, system]
    interface: step rate
    claim: "v4 steps per joint degree: yaw 53 (1/16 x 6), shoulder 62 (1/8 x 14), elbow 62 (1/16 x 7), wrist 27 (1/16 x 3). 30 deg/s on all four = ~6.1 k steps/s stepped in loop(), near the 5-10 k AVR software limit (estimate). Lower SPEED if moves stutter."
    evidence: firmware/arm_v4/arm_v4.ino
    status: unverified
  # ---------------- mechanical
  - between: [GT2 20T 5 mm bore pulley (5-pack), XYSLDJ XY42STH40-1204A NEMA 17 stepper (40 mm)]
    interface: shaft and bore
    claim: "Pulley bore 5 mm (listing title); motor shaft 5 mm round: the user's photo shows a GT2 20T pulley already on this motor."
    evidence: [user photo of motor with pulley, https://www.amazon.com/dp/B0DJQBZ6R1]
    status: verified
  - between: [GT2 20T 5 mm bore pulley (5-pack), High Efficiency Motors HEM-17D2008-10 NEMA 17 stepper (34 mm)]
    interface: shaft and bore
    claim: "v4 wrist: pulley bore 5 mm; HEM shaft 5 x 24 mm assumed (no datasheet). The pulley slides on the shaft, so its belt lane is set at assembly. Measure the shaft before printing upper_shank."
    evidence: [https://www.amazon.com/dp/B0DJQBZ6R1, parts/models/hem-17d2008-10.yaml]
    status: unverified
  - between: [GT2 20T 5 mm bore pulley (5-pack), system]
    interface: pulley height vs belt lane
    claim: "Listing says 15 mm wide x 15 mm high; the model is 16 x 16 with an estimated lane offset of 11.5 mm. Hub gaps in the design are 0.6 mm (wrist) and 1.4 mm (elbow). Set screws allow sliding the pulley; measure one on arrival and update the model."
    evidence: [https://www.amazon.com/dp/B0DJQBZ6R1, parts/models/gt2-20t-pulley.yaml, design/v4/geometry.py]
    status: unverified
  - between: [GT2 6 mm closed-loop belt 320 mm (2-pack), system]
    interface: belt length, wrap and tension travel
    claim: "v4 CAD pitch loops: shoulder stage 2 (36T-140T, C 63.4) 320.4, yaw (20T-120T, C 84.0) 320.2, elbow (20T-140T, C 69.5) 320.6 mm for a 320 mm belt; motor or idler slots give +-2.5..3 mm. Teeth in mesh on the small pulley: 11.7 / 7.5 / 6.3 (elbow is at the usual 6-tooth minimum; ~26 N belt pull at full elbow load, estimate). 3 belts needed, 2 packs = 4."
    evidence: [design/v4/belts.py, design/v4/geometry.py, https://www.amazon.com/dp/B0DR35HQX1]
    status: unverified
  - between: [Zeelo GT2 closed belt 200 mm x 6 mm (10 pcs), system]
    interface: belt length and wrap
    claim: "v4 CAD pitch loops: shoulder stage 1 (20T-72T, C 51.3) 200.0 mm, wrist (20T-60T, C 58.6) 200.0 mm; listing GT2, 200 mm, 6 mm wide, 10 pcs. Teeth in mesh 7.9 / 8.6. 2 belts needed of 10. Motor slots +-3 mm accept 196-204 mm loops (geometry.centre_distance)."
    evidence: [design/v4/belts.py, design/v4/geometry.py, https://www.amazon.com/dp/B0BZNTT5T4]
