note: 'Serial 4-DOF arm (yaw, shoulder, elbow, wrist) + parallel-jaw gripper: crank
  B, both idler links and both jaws are coupled to crank A (jaws counter-rotate on
  their crank pins, so they translate). Joints named *-stack / *-pin / mount-* are
  coupled counter-rotations that keep round bolts, nuts and washers at the fixed orientation
  the snapshots use.'
