note: 'v3 serial arm: yaw, shoulder (lower shank pitch), elbow and wrist are relative
  angles (elbow = th2 - th1, wrist = gripper pitch - th2); finger B mirrors finger
  A through the 1:1 gears. Known mismatch: every part position matches the pose files
  (<= 0.0001 mm), but the round hardware on the joint axes (bearings, spacers, washers,
  bolts, nuts, gripper mount screws and pivot) is written by build_assembly.py with
  a fixed orientation while it travels with its link, so rig-check reports 30-150
  deg rotation errors on those parts. They are symmetric about their own axis (the
  y axis), so the motion looks the same; it is a placement artifact, not a rig error.'
