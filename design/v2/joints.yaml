note: 'Parallel-linkage arm: elbow is the upper shank relative to the lower shank;
  the lever pulley (absolute upper-shank pitch) and the pleuel (stays parallel to
  the lower shank) are coupled; wrist is the gripper angle relative to the upper shank;
  finger B mirrors finger A through the 1:1 gears. The *-pin joints carry the axisymmetric
  bolts, washers and bearings at E, L, PU and the finger B pivot: they move with their
  joint but keep a fixed orientation, as placed in assembly.yaml.'
