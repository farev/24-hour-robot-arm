}
const prettyName = (n) => String(n).replace(/[_-]+/g, ' ').trim();

function assignPartColors() {
  const byKey = new Map();
  const seen = new Map();   // role -> parts so far (lightness steps, link tone alternation)
  const c = new THREE.Color();
  model.traverse((o) => {
    if (!o.isMesh || o.userData.noStyle) return;
    const name = partName(o);
    const kind = KIND_COLORS.find((k) => k.re.test(name));
    const key = kind ? kind.label : name;
    if (!byKey.has(key)) {
      const role = roleOf(kind ? `${kind.label} ${name}` : name);
      const k = seen.get(role.role) || 0;
      seen.set(role.role, k + 1);
      const base = role.role === 'link' ? LINK_TONES[k % 2] : role.color;
      const step = role.role === 'link' ? Math.floor(k / 2) : k;
      const color = c.setHex(base).offsetHSL(0, 0, [0, 0.06, -0.05, 0.1, -0.09][step % 5]).getHex();
      byKey.set(key, { key, label: kind ? kind.label : prettyName(name), color, role, meshes: [] });
    }
    const entry = byKey.get(key);
    entry.meshes.push(o);
    (entry.names = entry.names || new Set()).add(name);
    o.userData.part = entry;
  });
  partList = [...byKey.values()];
  buildLegend();
}

const _paperC = new THREE.Color(), _partC = new THREE.Color(), _amberC = new THREE.Color();
/** Flat (line-drawing) fill: the part color washed toward the paper so ink edges stay legible. */
function flatColor(hex, p) {
  return _partC.setHex(hex).lerp(_paperC.setHex(p.surface), isDark() ? 0.08 : 0.12).getHex();
}

function applyStyle() {
  if (!model) return;
  const p = palette();
  model.traverse((o) => {
    if (o.isMesh && !o.userData.noStyle) {
      const hex = o.userData.part ? o.userData.part.color : p.surface;
      const role = (o.userData.part && o.userData.part.role) || ROLES[ROLES.length - 1];
      const ghost = role.opacity != null ? { transparent: true, opacity: role.opacity, depthWrite: false } : {};
      if (!o.userData.shadedMaterial) {
        o.userData.shadedMaterial = withCap(new THREE.MeshStandardMaterial({
          color: hex, roughness: role.rough, metalness: role.metal, envMapIntensity: 0.9, side: THREE.DoubleSide, ...ghost,
        }));
      }
      if (!o.userData.flatMaterial) {
        o.userData.flatMaterial = withCap(new THREE.MeshBasicMaterial({
          color: p.surface, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1, side: THREE.DoubleSide, ...ghost,
        }));
      }
      o.userData.flatMaterial.color.setHex(flatColor(hex, p));
      const drifts = driftOf(o);
      o.userData.shadedMaterial.emissive.setHex(drifts ? DRIFT_TINT : 0x000000);
      o.userData.shadedMaterial.emissiveIntensity = drifts ? DRIFT_INTENSITY : 1;
      if (drifts) o.userData.flatMaterial.color.lerp(_amberC.setHex(DRIFT_TINT), 0.35);   // flat fills have no emissive
      o.material = studyMaterial(o) || (shaded ? o.userData.shadedMaterial : o.userData.flatMaterial);
      o.material.clippingPlanes = clipPlanes();
      o.castShadow = shaded && !st.mode;
      if (!o.userData.edges) {
        const edges = new THREE.LineSegments(
          new THREE.EdgesGeometry(o.geometry, 30),
          new THREE.LineBasicMaterial({ color: p.ink, transparent: true })
        );
        edges.raycast = () => {};
        o.add(edges);
        o.userData.edges = edges;
      }
      // Line mode: full ink outlines. Shaded: soft edges that define the form without boxing it.
      const hotEdge = o.userData.part && o.userData.part === hotPart;
      o.userData.edges.material.opacity = hotEdge ? 1 : role.opacity != null ? 0.25 : shaded ? 0.28 : 0.9;
      o.userData.edges.material.color.setHex(hotEdge ? p.accent : p.ink);
      o.userData.edges.material.clippingPlanes = clipPlanes();
      o.userData.edges.visible = true;
    }
  });
  scene.environment = shaded ? envMap : null;
  hemi.visible = sun.visible = shaded;
  shadowFloor.visible = shaded && !st.mode;
  applyWiringStyle();
  hexVec(isDark() ? 0x1d6fa3 : 0x8fcdf5, capUniforms.uCapColor.value);
  if (grid) rebuildGrid(grid.userData.size || 1);
}

/** Bounds of what is on screen: the whole model, or only the visible parts when some are hidden. */
function visibleBox() {
  if (hiddenKeys.size) {
    model.updateMatrixWorld(true);
    const box = new THREE.Box3();
    for (const part of partList) {
      if (hiddenKeys.has(part.key)) continue;
      for (const m of part.meshes) box.union(new THREE.Box3().setFromObject(m));
    }
    if (!box.isEmpty()) return box;
  }
  return new THREE.Box3().setFromObject(model);
}

function fit() {
  if (!model) return;
  const box = visibleBox();
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const sphere = box.getBoundingSphere(new THREE.Sphere());
  const r = Math.max(sphere.radius, 1e-6);
  const dist = r / Math.sin(THREE.MathUtils.degToRad(perspCam.fov) / 2) * 1.15;
  const dir = new THREE.Vector3(1, 0.7, 1.15).normalize();
  setView(center, dir, dist, false);
  const gridSize = niceStep(Math.max(size.x, size.z, size.y) * 2.5);
  rebuildGrid(gridSize);
  sun.position.copy(center).add(new THREE.Vector3(r * 2, r * 4, r * 3));
  sun.target.position.copy(center);
  const s = sun.shadow.camera;
  s.left = s.bottom = -r * 2; s.right = s.top = r * 2; s.near = r * 0.1; s.far = r * 10;
  s.updateProjectionMatrix();
}

function showDims() {
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  // glTF is metres by spec; treat a huge model as millimetres.
  const toMM = Math.max(size.x, size.y, size.z) > 20 ? 1 : 1000;
  const f = (v) => Math.round(v * toMM);
  unitScale = toMM;
  dimsEl.textContent = `W ${f(size.x)} × D ${f(size.z)} × H ${f(size.y)} mm`;
  dimsEl.classList.remove('hidden');
}

function onLoaded(gltf) {
  collapseExplode();   // put the old model's parts back before it goes away
  if (model) {
    disposeRig();
    detachReplay();
    scene.remove(model);
    model.traverse((o) => {
      if (o.geometry) o.geometry.dispose();
      if (o.userData && o.userData.flatMaterial) o.userData.flatMaterial.dispose();
      if (o.userData && o.userData.shadedMaterial) o.userData.shadedMaterial.dispose();
      if (o.userData && o.userData.edges) o.userData.edges.material.dispose();   // per-mesh outline material
    });
    resetInspection();
  }
  model = gltf.scene;
  hotPart = hoverPart = pinnedPart = null;
  assignPartColors();
  // Stand the model on the floor (y = 0).
  const box = new THREE.Box3().setFromObject(model);
  model.position.y -= box.min.y;
  scene.add(model);
  applyStyle();
  fit();
  showDims();
  setStatus('');
  modelLoaded();
  post({ type: 'loaded' });
  if (rp.data) attachReplay();
  else if (mv.on) startMotion();
  invalidate();
}

// Part legend and hover ------------------------------------------------------
const legendEl = document.getElementById('legend');
const hoverEl = document.getElementById('hover');
// hotPart is what is highlighted: the hovered part, else the one picked by clicking in the view.
let hotPart = null, hoverPart = null, pinnedPart = null;
const hiddenKeys = new Set();   // legend row keys whose meshes are hidden
let showAllEl = null;

function updateHot() {
  const next = hoverPart || pinnedPart;
  if (next === hotPart) return;
  hotPart = next;
  const p = palette();
  if (model) model.traverse((o) => {
    if (o.userData && o.userData.edges) {
      const hot = o.userData.part && o.userData.part === hotPart;
      const role = o.userData.part && o.userData.part.role;
      o.userData.edges.material.color.setHex(hot ? p.accent : p.ink);
      o.userData.edges.material.opacity = hot ? 1 : role && role.opacity != null ? 0.25 : shaded ? 0.28 : 0.9;
    }
  });
  for (const row of legendEl.querySelectorAll('.row')) row.classList.toggle('hot', !!hotPart && row.dataset.key === hotPart.key);
  invalidate();
}
function setHotPart(part) { hoverPart = part; updateHot(); }
function pinPart(part) { pinnedPart = part; updateHot(); }

/** Meshes and legend squares follow hiddenKeys. */
function applyVisibility() {
  for (const part of partList) {
    const on = !hiddenKeys.has(part.key);
    for (const m of part.meshes) m.visible = on;
    if (part.row) {
      part.row.classList.toggle('off', !on);
      part.row.querySelector('.sw').setAttribute('aria-pressed', String(on));
    }
  }
  if (showAllEl) showAllEl.classList.toggle('hidden', hiddenKeys.size === 0);
  if (model && nodes.size) renderInspector();   // its Hide / Isolate buttons follow
}

/** Click: toggle one row. Option-click: show only that row; option-click on the only visible row shows all. */
function clickSwatch(part, e) {
  if (e.altKey) {
    const alone = partList.every((p) => (p === part) === !hiddenKeys.has(p.key));
    hiddenKeys.clear();
    if (!alone) for (const p of partList) if (p !== part) hiddenKeys.add(p.key);
  } else if (hiddenKeys.has(part.key)) {
    hiddenKeys.delete(part.key);
  } else {
    hiddenKeys.add(part.key);
  }
  applyVisibility();
}

function buildLegend() {
  legendEl.innerHTML = '';
  // Keep hidden rows across a reload of the same parts; rows that no longer exist are forgotten.
  for (const k of [...hiddenKeys]) if (partList.length < 2 || !partList.some((p) => p.key === k)) hiddenKeys.delete(k);
  for (const part of partList) {
    const row = document.createElement('div');
    row.className = 'row';
    row.dataset.key = part.key;
    const sw = document.createElement('button');
    sw.type = 'button';
    sw.className = 'sw';
    sw.style.setProperty('--c', '#' + part.color.toString(16).padStart(6, '0'));
    sw.title = 'Show / hide this part (option-click: show only this)';
    sw.setAttribute('aria-label', `Show ${part.label}`);
    sw.setAttribute('aria-pressed', 'true');
    sw.addEventListener('click', (e) => clickSwatch(part, e));
    const label = document.createElement('span');
    label.textContent = part.names.size > 1 ? `${part.label} ×${part.names.size}` : part.label;
    row.append(sw, label);
    part.labelEl = label;
    row.addEventListener('mouseenter', () => setHotPart(part));
    row.addEventListener('mouseleave', () => setHotPart(null));
    part.row = row;
    legendEl.appendChild(row);
  }
  showAllEl = document.createElement('button');
  showAllEl.type = 'button';
  showAllEl.className = 'showall hidden';
  showAllEl.textContent = 'Show all';
  showAllEl.addEventListener('click', () => { hiddenKeys.clear(); applyVisibility(); });
  legendEl.appendChild(showAllEl);
  legendEl.classList.toggle('hidden', partList.length < 2);
  decorateLegend();
  applyVisibility();
}

/** Amber "!" on rows whose part drifted from the chosen BOM item, "rough model" on placeholder models. */
function decorateLegend() {
  for (const part of partList) {
    if (!part.labelEl) continue;
    for (const old of part.labelEl.querySelectorAll('.lk')) old.remove();
    const ls = [...part.names].map((nm) => links && linkFor(links, nm)).filter(Boolean);
    const add = (text, cls, title) => {
      const b = document.createElement('span');
      b.className = 'lk ' + cls; b.textContent = text; b.title = title;
      part.labelEl.appendChild(b);
    };
    if (ls.some((l) => l.drift)) add('!', 'bang', 'The BOM now picks a different item: rebuild the CAD to match');
    if (ls.some((l) => l.placeholder)) add('rough model', 'rough', 'This model is a stand-in, not the real part');
  }
}

const raycaster = new THREE.Raycaster();
const _ndc = new THREE.Vector2();
let pointerDown = false;
let downAt = null;   // [x, y] of a primary press on the canvas, to tell a click from an orbit drag

/** First visible part under the pointer. (Raycaster does not skip invisible objects itself.) */
function pickPart(e) {
  if (!model) return null;
  _ndc.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(_ndc, camera);
  return raycaster.intersectObject(model, true).find((h) => h.object.isMesh && h.object.visible && h.object.userData.part && unclipped(h.point)) || null;
}

// Hover picking raycasts the whole model (and the harness, or several rays plus edge projection when
// measuring), so pointermove only records the latest event and frame() handles it once per frame.
let pendingHover = null;
function flushHover() {
  const e = pendingHover;
  pendingHover = null;
  if (!e) return;
  try { hoverAt(e); } catch (err) { reportError('pointermove', err); }
}
renderer.domElement.addEventListener('pointerdown', (e) => {
  flushHover();   // a move just before the press is handled first, as it was before coalescing
  pointerDown = true;
  downAt = e.button === 0 ? [e.clientX, e.clientY] : null;
});
window.addEventListener('pointerup', () => { pointerDown = false; });
renderer.domElement.addEventListener('pointerup', (e) => {
  const start = downAt;
  downAt = null;
  if (!start || !model || Math.hypot(e.clientX - start[0], e.clientY - start[1]) >= 4) return;
  if (tool !== 'select') { measureClick(e); return; }
  const hit = pickPart(e);
  const wire = pickHarness(e, hit);
  if (wire) { pinPart(null); sel.node = null; sel.wire = wire; applyWiringStyle(); renderInspector(); updateBracket(); return; }
  pinPart(hit ? hit.object.userData.part : null);
  selectNode(hit ? hit.object : null);
  if (hit && hit.object.userData.part.row) hit.object.userData.part.row.scrollIntoView({ block: 'nearest' });
});
renderer.domElement.addEventListener('pointerleave', () => { pendingHover = null; hoverEl.classList.add('hidden'); setHotPart(null); measureHover(null); });
renderer.domElement.addEventListener('pointermove', (e) => {
  if (!model || pointerDown) return;
  pendingHover = e;
  invalidate(0);
});
function hoverAt(e) {
  if (!model || pointerDown) return;
  if (tool !== 'select') { hoverEl.classList.add('hidden'); measureHover(e); return; }
  const hit = pickPart(e);
  const wire = pickHarness(e, hit);
  const hc = wire && wire.type === 'cable' ? wire.cable : null;
  if (hc !== wr.hover) { wr.hover = hc; applyWiringStyle(); }
  if (wire) {
    hoverEl.textContent = wire.type === 'cable' ? `${wire.cable.label} · ${wire.cable.gauge}` : prettyName(wire.comp.label);
    hoverEl.style.left = e.clientX + 'px'; hoverEl.style.top = e.clientY + 'px';
    hoverEl.classList.remove('hidden'); setHotPart(null);
    return;
  }
  if (hit) {
    hoverEl.textContent = prettyName(partName(hit.object)) + hoverMass(hit.object);
    hoverEl.style.left = e.clientX + 'px';
    hoverEl.style.top = e.clientY + 'px';
    hoverEl.classList.remove('hidden');
    setHotPart(hit.object.userData.part);
  } else {
    hoverEl.classList.add('hidden');
    setHotPart(null);
  }
}

// Sim theater (contracts.md section 11) ------------------------------------
// Animates the named GLB bodies (turntable, upper_arm, forearm, hand) from
// sim/<task>/replay.json and draws the ball (67 mm sphere), its travelled path
// (solid), the predicted path (dashed) and the catch point (cross).
let BALL_R = 0.067 / 2;    // replay.json ball_diameter_m overrides (the pick sim's payload is 40 mm)
const JOINT_NODES = ['turntable', 'upper_arm', 'forearm', 'hand'];
const JOINT_LABELS = ['BASE', 'SHLD', 'ELB', 'WR'];
const DEFAULT_AXES = { turntable: [0, 0, 1], upper_arm: [0, -1, 0], forearm: [0, -1, 0], hand: [0, -1, 0] };
const END_HOLD_S = 1.0;

const rp = {
  data: null, title: '', index: 0, t: 0, playing: true, speed: 1, hold: 0, scrubbing: false,
  rig: null, frame: null, ownFrame: false, group: null, objs: null, note: '',
};
const $ = (id) => document.getElementById(id);
const ui = {
  head: $('rp-head'), bar: $('rp-bar'), outcome: $('rp-outcome'), label: $('rp-label'), note: $('rp-note'),
  joints: $('rp-joints'), prev: $('rp-prev'), play: $('rp-play'), next: $('rp-next'), scrub: $('rp-scrub'),
  time: $('rp-time'), speed: $('rp-speed'),
};
let uiCache = { time: '', scrub: -1, joints: '' };

function vec3(p) {
  if (!Array.isArray(p) || p.length < 3) return null;
  const v = [Number(p[0]), Number(p[1]), Number(p[2])];
  return v.every(Number.isFinite) ? v : null;
}

function normalizeReplay(d) {
  if (!d || typeof d !== 'object' || !Array.isArray(d.throws)) throw new Error('replay.json has no throws');
  const dt = Number(d.dt) > 0 ? Number(d.dt) : 0.01;
  const throws = d.throws.map((th, i) => {
    th = th || {};
    const q = Array.isArray(th.q) ? th.q.filter((r) => Array.isArray(r)).map((r) => r.map(Number)) : [];
    const ball = Array.isArray(th.ball) ? th.ball.map(vec3).filter(Boolean) : [];
    const n = Math.max(q.length, ball.length, 2);
    let t = Array.isArray(th.t) ? th.t.map(Number).filter(Number.isFinite) : [];
    if (t.length < 2) t = Array.from({ length: n }, (_, k) => k * dt);
    return {
      id: th.id != null ? th.id : i + 1,
      outcome: String(th.outcome || 'unknown'),
      t, q, ball,
      predicted: Array.isArray(th.predicted) ? th.predicted.map(vec3).filter(Boolean) : [],
      catchPoint: vec3(th.catch_point),
    };
  }).filter((th) => th.q.length || th.ball.length);
  if (!throws.length) throw new Error('replay.json has no throws');
  const axes = Object.assign({}, DEFAULT_AXES);
  if (d.joint_axes && typeof d.joint_axes === 'object') {
    for (const k of JOINT_NODES) { const a = vec3(d.joint_axes[k]); if (a) axes[k] = a; }
  }
  // Optional override of the joint angles arm.glb was exported at. Normally not needed: the
  // rest angle is read from each node's own rotation (see bindRig).
  const rest = Array.isArray(d.glb_q) ? JOINT_NODES.map((_, k) => Number(d.glb_q[k]) || 0) : null;
  const ballD = Number(d.ball_diameter_m) > 0 ? Number(d.ball_diameter_m) : 0.067;
  return { variant: d.variant, axes, axesGiven: !!d.joint_axes, rest, throws, ballD };
}

const currentThrow = () => (rp.data ? rp.data.throws[rp.index] : null);
const clamp01 = (x) => Math.min(1, Math.max(0, x));

/** Segment index i (0..n-2) and fraction f for time t in a monotonic array. */
function locate(ts, t) {
  const n = ts.length;
  if (n < 2 || t <= ts[0]) return [0, 0];
  if (t >= ts[n - 1]) return [n - 2, 1];
  let lo = 0, hi = n - 1;
  while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (ts[mid] <= t) lo = mid; else hi = mid; }
  const span = ts[hi] - ts[lo];
  return [lo, span > 0 ? (t - ts[lo]) / span : 0];
}

/** Interpolated row of `rows` at time t. Rows sampled on th.t, or spread evenly over it. */
function sampleRows(rows, th, t) {
  if (!rows.length) return null;
  if (rows.length === 1) return { v: rows[0], i: 0 };
  let i, f;
  if (rows.length === th.t.length) {
    [i, f] = locate(th.t, t);
  } else {
    const t0 = th.t[0], t1 = th.t[th.t.length - 1];
    const u = clamp01((t - t0) / Math.max(1e-9, t1 - t0)) * (rows.length - 1);
    i = Math.min(rows.length - 2, Math.floor(u)); f = u - i;
  }
  const a = rows[i], b = rows[i + 1];
  return { v: a.map((x, k) => x + ((Number.isFinite(b[k]) ? b[k] : x) - x) * f), i: f > 0 ? i + 1 : i };
}

/** Angle of the twist of quaternion q about unit axis a (radians). */
function twistAngle(q, a) {
  const proj = q.x * a.x + q.y * a.y + q.z * a.z;
  let ang = 2 * Math.atan2(proj, q.w);
  if (ang > Math.PI) ang -= 2 * Math.PI;
  if (ang < -Math.PI) ang += 2 * Math.PI;
  return ang;
}

/**
 * Joint angle the GLB node sits at. arm.glb stores each body's rest pose as its node
 * rotation R(axis, rest) (engine/mechy/cad/glb.py), so the twist of that rotation about the
 * axis is the rest angle; extras.q / rest_q override it when present.
 */
function restAngle(node, axis) {
  const u = node.userData || {};
  for (const k of ['q', 'rest_q', 'joint_q']) if (Number.isFinite(Number(u[k]))) return Number(u[k]);
  return twistAngle(node.userData.mechyRestQ || node.quaternion, axis);
}

/** Find the joint bodies and the arm base frame (z up, metres) in the loaded model. */
function bindRig() {
  rp.rig = null; rp.frame = null; rp.ownFrame = false; rp.note = '';
  if (!model) return;
  const nodes = {};
  for (const n of JOINT_NODES) nodes[n] = model.getObjectByName(n) || null;
  const missing = JOINT_NODES.filter((n) => !nodes[n]);
  if (!missing.length) {
    rp.rig = JOINT_NODES.map((n, k) => {
      const node = nodes[n];
      if (!node.userData.mechyRestQ) node.userData.mechyRestQ = node.quaternion.clone();
      // Axis: replay.json joint_axes, else the node's extras.axis, else the contract default.
      const extra = vec3(node.userData.axis);
      const a = (!rp.data.axesGiven && extra) ? extra : rp.data.axes[n];
      const axis = new THREE.Vector3().fromArray(a).normalize();
      return {
        node, axis,
        rest: rp.data.rest ? rp.data.rest[k] : restAngle(node, axis),
        restQ: node.userData.mechyRestQ,
      };
    });
    const base = model.getObjectByName('base');
    const parent = (base || nodes.turntable).parent;
    if (parent && parent !== model) rp.frame = parent;
    bindCoupled();
  } else {
    rp.note = missing.length === JOINT_NODES.length
      ? 'Static model: no joint nodes in arm.glb (rebuild CAD)'
      : `Static model: arm.glb lacks ${missing.join(', ')}`;
  }
  if (!rp.frame) {
    // glTF is y-up; the arm frame is z-up (the same wrapper build123d writes).
    const g = new THREE.Group();
    g.name = 'mechy_arm_frame';
    g.rotation.x = -Math.PI / 2;
    model.add(g);
    rp.frame = g; rp.ownFrame = true;
  }
}

const _q = new THREE.Quaternion();

/** Passive-linkage nodes (ref_arm GLB): extras.coupled = [[joint_index, coeff], ...]; the node's
 * local angle about extras.axis is rest + sum(coeff * (q[j] - rest_q[j])). */
function bindCoupled() {
  rp.coupled = [];
  if (!model) return;
  const rq = (model.userData && model.userData.rest_q_rad) || (rp.data && rp.data.rest) || [0, 0, 0, 0];
  rp.restQ = rq;
  model.traverse((o) => {
    const u = o.userData || {};
    if (!Array.isArray(u.coupled)) return;
    if (!u.mechyRestQ) u.mechyRestQ = o.quaternion.clone();
    const axis = new THREE.Vector3().fromArray(vec3(u.axis) || [0, -1, 0]).normalize();
    rp.coupled.push({ node: o, axis, rest: Number(u.rest) || 0, coupled: u.coupled });
  });
}

function applyCoupled(deltaQ) {
  if (!rp.coupled) return;
  for (const c of rp.coupled) {
    let ang = c.rest;
    for (const [j, coef] of c.coupled) ang += coef * (deltaQ[j] || 0);
    c.node.quaternion.setFromAxisAngle(c.axis, ang);
  }
}

function levelWrist() {
  return !!(model && model.userData && model.userData.kinematics === 'parallel_level');
}

function applyPose(q) {
  if (!rp.rig || !q) return;
  const qq = q.slice();
  if (levelWrist()) qq[3] = -(Number(qq[1]) + Number(qq[2]));   // passive wrist keeps the hand level
  rp.rig.forEach((j, k) => {
    const a = Number(qq[k]);
    if (!Number.isFinite(a)) return;
    // Axis is fixed in the parent body: pre-multiply the rest orientation.
    _q.setFromAxisAngle(j.axis, a - j.rest);
    j.node.quaternion.copy(_q).multiply(j.restQ);
  });
  applyCoupled(qq.map((a, k) => Number(a) - (rp.restQ ? rp.restQ[k] : rp.rig[k].rest)));
}

function resetPose() {
  if (rp.rig) rp.rig.forEach((j) => j.node.quaternion.copy(j.restQ));
  if (rp.coupled) rp.coupled.forEach((c) => c.node.quaternion.copy(c.node.userData.mechyRestQ));
}

function disposeTree(root) {
  root.traverse((o) => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => m.dispose());
  });
}

function clearThrowObjects() {
  if (!rp.group) return;
  if (rp.group.parent) rp.group.parent.remove(rp.group);
  disposeTree(rp.group);
  rp.group = null; rp.objs = null;
}

const v3 = (a) => new THREE.Vector3(a[0], a[1], a[2]);

function buildThrow() {
  clearThrowObjects();
  const th = currentThrow();
  if (!th || !rp.frame) return;
  const p = palette();
  const g = new THREE.Group();
  g.name = 'mechy_replay';
  const objs = {};

  if (th.predicted.length >= 2) {
    const geo = new THREE.BufferGeometry().setFromPoints(th.predicted.map(v3));
    const line = new THREE.Line(geo, new THREE.LineDashedMaterial({ color: p.muted, dashSize: 0.015, gapSize: 0.015 }));
    line.computeLineDistances();
    g.add(line); objs.predicted = line;
  }
  if (th.ball.length >= 2) {
    const geo = new THREE.BufferGeometry().setFromPoints(th.ball.map(v3));
    geo.setDrawRange(0, 1);
    const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: p.ink }));
    g.add(line); objs.trail = line;
  }
  if (th.ball.length) {
    const ball = new THREE.Group();
    const fill = new THREE.Mesh(new THREE.SphereGeometry(BALL_R, 32, 16), new THREE.MeshBasicMaterial({ color: p.surface }));
    // Inverted hull: a slightly larger back-face sphere draws the ink outline.
    const rim = new THREE.Mesh(new THREE.SphereGeometry(BALL_R * 1.14, 32, 16),
      new THREE.MeshBasicMaterial({ color: p.ink, side: THREE.BackSide }));
    fill.userData.noStyle = rim.userData.noStyle = true;
    fill.raycast = rim.raycast = () => {};
    ball.add(fill, rim);
    ball.position.copy(v3(th.ball[0]));
    g.add(ball); objs.ball = ball; objs.fill = fill; objs.rim = rim;
  }
  if (th.catchPoint) {
    const c = th.catchPoint, s = 0.022;
    const pts = [
      [c[0] - s, c[1], c[2]], [c[0] + s, c[1], c[2]],
      [c[0], c[1] - s, c[2]], [c[0], c[1] + s, c[2]],
      [c[0], c[1], c[2] - s], [c[0], c[1], c[2] + s],
    ].map(v3);
    const cross = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({ color: p.accent, depthTest: false, transparent: true }));
    cross.renderOrder = 10;
    g.add(cross); objs.cross = cross;
  }
  rp.frame.add(g);
  rp.group = g; rp.objs = objs;
}

function restyleReplay() {
  if (!rp.objs) return;
  const p = palette(), o = rp.objs;
  if (o.predicted) o.predicted.material.color.setHex(p.muted);
  if (o.trail) o.trail.material.color.setHex(p.ink);
  if (o.fill) o.fill.material.color.setHex(p.surface);
  if (o.rim) o.rim.material.color.setHex(p.ink);
  if (o.cross) o.cross.material.color.setHex(p.accent);
}

function renderReplayFrame() {
  const th = currentThrow();
  if (!th) return;
  const t0 = th.t[0], t1 = th.t[th.t.length - 1];
  const q = sampleRows(th.q, th, rp.t);
  if (q) applyPose(q.v);
  const b = sampleRows(th.ball, th, rp.t);
  if (b && rp.objs) {
    if (rp.objs.ball) rp.objs.ball.position.set(b.v[0], b.v[1], b.v[2]);
    if (rp.objs.trail) rp.objs.trail.geometry.setDrawRange(0, Math.max(1, b.i + 1));
  }
  // Controls (only touch the DOM when something changed).
  const time = `${(rp.t - t0).toFixed(2)} / ${(t1 - t0).toFixed(2)} s`;
  if (time !== uiCache.time) { ui.time.textContent = time; uiCache.time = time; }
  if (!rp.scrubbing) {
    const sv = Math.round(clamp01((rp.t - t0) / Math.max(1e-9, t1 - t0)) * 1000);
    if (sv !== uiCache.scrub) { ui.scrub.value = String(sv); uiCache.scrub = sv; }
  }
  if (q) {
    const j = q.v.slice(0, 4).map((a, k) => `${JOINT_LABELS[k]} ${Math.round(a * 180 / Math.PI)}°`).join('  ');
    if (j !== uiCache.joints) { ui.joints.textContent = j; uiCache.joints = j; }
  }
}

const replayClock = new THREE.Clock();
function tickReplay() {
  const dt = Math.min(replayClock.getDelta(), 0.1);
  const th = currentThrow();
  if (!th || !model || poseLocked()) return;   // exploded: the pose stays put
  const t0 = th.t[0], t1 = th.t[th.t.length - 1];
  if (rp.playing && !rp.scrubbing) {
    if (rp.t >= t1) {
      rp.hold += dt;
      if (rp.hold >= END_HOLD_S) { rp.hold = 0; rp.t = t0; }
    } else {
      rp.t = Math.min(t1, rp.t + dt * rp.speed);
    }
  }
  renderReplayFrame();
}

function outcomeText(o) { return String(o).replace(/[_-]+/g, ' ').toUpperCase(); }

function updateReplayLabels() {
  const th = currentThrow();
  if (!th) return;
  const n = rp.data.throws.length;
  ui.outcome.textContent = outcomeText(th.outcome);
  ui.outcome.className = 'tag ' + (th.outcome === 'caught' ? 'good' : (th.outcome === 'unknown' ? '' : 'bad'));
  ui.label.textContent = `${rp.title ? rp.title + ' · ' : ''}Throw ${th.id} · ${rp.index + 1}/${n}`;
  ui.note.textContent = rp.note;
  ui.note.classList.toggle('hidden', !rp.note);
  ui.joints.classList.toggle('hidden', !th.q.length);
  ui.prev.disabled = ui.next.disabled = n < 2 || poseLocked();
  ui.play.disabled = ui.scrub.disabled = poseLocked();
  ui.play.innerHTML = rp.playing ? '&#x275A;&#x275A;' : '&#x25B6;';
  ui.speed.innerHTML = rp.speed === 1 ? '1&#xD7;' : '0.25&#xD7;';
}

function setThrow(i) {
  if (!rp.data) return;
  const n = rp.data.throws.length;
  rp.index = ((i % n) + n) % n;
  const th = currentThrow();
  rp.t = th.t[0]; rp.hold = 0;
  uiCache = { time: '', scrub: -1, joints: '' };
  buildThrow();
  updateReplayLabels();
  renderReplayFrame();
}

function showReplayUI(on) {
  ui.head.classList.toggle('hidden', !on);
  ui.bar.classList.toggle('hidden', !on);
  document.body.classList.toggle('replaying', on);
}

/** Bind the stored replay to the current model and show the first throw. */
function attachReplay() {
  if (!rp.data || !model) return;
  collapseExplode();
  if (mv.on) stopMotion(true);
  bindRig();
  setThrow(Math.min(rp.index, rp.data.throws.length - 1));
  showReplayUI(true);
  fit();
  post({ type: 'replayLoaded', throws: rp.data.throws.length, animated: !!rp.rig });
}

/** Remove replay objects from the model (keeps rp.data so a reloaded model re-attaches). */
function detachReplay() {
  collapseExplode();
  clearThrowObjects();
  resetPose();
  if (rp.ownFrame && rp.frame && rp.frame.parent) rp.frame.parent.remove(rp.frame);
  rp.rig = null; rp.frame = null; rp.ownFrame = false;
}

function setReplay(obj, title) {
  try {
    rp.data = normalizeReplay(obj);
    BALL_R = rp.data.ballD / 2;
  } catch (e) {
    rp.data = null;
    showReplayUI(false);
    setStatus(String(e && e.message || 'Could not read replay.json'));
    post({ type: 'replayFailed', error: String(e && e.message || e), parse: true });
    return;
  }
  rp.title = title || '';
  rp.index = 0; rp.playing = true; rp.hold = 0;
  detachReplay();
  if (model) attachReplay();
  invalidate();   // also reached from an XHR callback (loadReplayURL)
}

function closeReplay() {
  if (!rp.data && !rp.group) return;
  collapseExplode();
  detachReplay();
  rp.data = null;
  showReplayUI(false);
  if (mv.on) startMotion();
  fit();
}

function togglePlay() {
  const th = currentThrow();
  if (!th) return;
  if (!rp.playing && rp.t >= th.t[th.t.length - 1]) rp.t = th.t[0];
  rp.playing = !rp.playing; rp.hold = 0;
  updateReplayLabels();
}

ui.play.addEventListener('click', togglePlay);
ui.prev.addEventListener('click', () => setThrow(rp.index - 1));
ui.next.addEventListener('click', () => setThrow(rp.index + 1));
ui.speed.addEventListener('click', () => { rp.speed = rp.speed === 1 ? 0.25 : 1; updateReplayLabels(); });
ui.scrub.addEventListener('input', () => {
  const th = currentThrow();
  if (!th) return;
  rp.scrubbing = true;
  if (rp.playing) { rp.playing = false; updateReplayLabels(); }
  const t0 = th.t[0], t1 = th.t[th.t.length - 1];
  rp.t = t0 + (Number(ui.scrub.value) / 1000) * (t1 - t0); rp.hold = 0;
});
ui.scrub.addEventListener('change', () => { rp.scrubbing = false; });
window.addEventListener('keydown', (e) => {
  if (poseLocked()) return;
  if (!rp.data) {
    if (mv.on && e.key === ' ') { toggleMotionPlay(); e.preventDefault(); }
    return;
  }
  if (e.key === ' ') { togglePlay(); e.preventDefault(); }
  else if (e.key === '[') setThrow(rp.index - 1);
  else if (e.key === ']') setThrow(rp.index + 1);
});


// Motion sim ---------------------------------------------------------------
// Animates the arm's joint bodies through a looping demo routine (reach, pick, swing,
// place) with minimum-jerk moves between waypoints, or holds a pose set by the joint
// sliders. Kinematic only: it shows how the arm moves, not whether the motors can do it
// (that is what the catch sim replay is for).
const MV_LIMITS = [[-180, 180], [-100, 100], [-120, 120], [-110, 110]];   // degrees about rest
// Waypoints: degrees relative to the ready pose, [base, shoulder, elbow, wrist], seconds to get there.
const MV_ROUTINE = [
  { d: [0, 0, 0, 0], t: 1.0 },
  { d: [-55, 25, -35, 20], t: 1.4 },      // reach out to the left
  { d: [-55, 40, -55, 25], t: 0.8 },      // dip to pick
  { d: [-55, 15, -20, 5], t: 0.8 },       // lift
  { d: [60, 15, -20, 5], t: 1.8 },        // swing across
  { d: [60, 38, -50, 22], t: 0.8 },       // place
  { d: [60, -10, 25, -20], t: 1.2 },      // raise high
  { d: [0, -25, 45, -30], t: 1.4 },       // tall pose, centred
  { d: [0, 0, 0, 0], t: 1.2 },            // back to ready
];
// Parallel-linkage arms (bam-v2): the shanks are tied by the levelling links, so the moves stay
// inside the joint limits (shoulder 15..160 deg, elbow -142..-39 deg about a 137 / -111 deg ready pose).
const MV_LIMITS_PARALLEL = [[-150, 150], [-60, 20], [-28, 60], [0, 0]];
const MV_ROUTINE_PARALLEL = [
  { d: [0, 0, 0, 0], t: 1.0 },
  { d: [-60, -20, 15, 0], t: 1.4 },       // reach out to the left
  { d: [-60, -35, 35, 0], t: 0.8 },       // dip to pick
  { d: [-60, -15, 10, 0], t: 0.8 },       // lift
  { d: [60, -15, 10, 0], t: 1.8 },        // swing across
  { d: [60, -35, 35, 0], t: 0.8 },        // place
  { d: [60, 10, -15, 0], t: 1.2 },        // raise
  { d: [0, 15, -25, 0], t: 1.4 },         // tall pose, centred
  { d: [0, 0, 0, 0], t: 1.2 },            // back to ready
];
const mvRoutine = () => (levelWrist() ? MV_ROUTINE_PARALLEL : MV_ROUTINE);
const mvLimits = () => (levelWrist() ? MV_LIMITS_PARALLEL : MV_LIMITS);
const MV_HOLD_S = 0.25;
const mv = { on: false, playing: true, speed: 1, rig: null, t: 0, seg: 0, hold: 0, pose: [0, 0, 0, 0], resumeFrom: null };
const mvUI = { bar: $('mv-bar'), play: $('mv-play'), home: $('mv-home'), speed: $('mv-speed'), fold: $('mv-fold'),
               joints: $('mv-joints'),
               title: $('mv-title'), text: $('mv-text'), sliders: [], values: [],
               kind: null };   // which sliders are in #mv-joints: 'arm' | 'rig' | null
/** The title text lives in its own element so #mv-live (the playing dot) is never overwritten. */
function setMvTitle(text) { if (mvUI.text.textContent !== text) mvUI.text.textContent = text; }
const MV_TITLE = 'Motion sim · demo moves, drag a slider to pose';

function bindMotionRig() {
  if (!model) return null;
  const nodes = JOINT_NODES.map((n) => model.getObjectByName(n));
  if (nodes.some((n) => !n)) return null;
  bindCoupled();                  // the linkage parts follow the joints here too, not only in replays
  return nodes.map((node) => {
    if (!node.userData.mechyRestQ) node.userData.mechyRestQ = node.quaternion.clone();
    const axis = new THREE.Vector3().fromArray(vec3(node.userData.axis) || DEFAULT_AXES[node.name]).normalize();
    return { node, axis, rest: restAngle(node, axis), restQ: node.userData.mechyRestQ };
  });
}

function applyMotionPose(deg) {
  if (!mv.rig) return;
  const dd = deg.slice();
  if (levelWrist()) dd[3] = -(dd[1] + dd[2]);        // parallel linkage: wrist follows the level rule
  mv.rig.forEach((j, k) => {
    _q.setFromAxisAngle(j.axis, dd[k] * Math.PI / 180);
    j.node.quaternion.copy(_q).multiply(j.restQ);
  });
  applyCoupled(dd.map((d) => d * Math.PI / 180));
  postArmPose(dd);
}

// The pose goes to the app (degrees about the ready pose, [base, shoulder, elbow, wrist]) so bench
// motors can follow the sim; at most every 40 ms.
let armPoseSent = 0;
function postArmPose(deg) {
  const now = performance.now();
  if (now - armPoseSent < 40) return;
  armPoseSent = now;
  post({ type: 'armPose', deg });
}

const minJerk = (u) => u * u * u * (10 - 15 * u + 6 * u * u);

function buildMotionUI() {
  mvUI.joints.innerHTML = ''; mvUI.sliders = []; mvUI.values = []; mvUI.kind = 'arm';
  JOINT_LABELS.forEach((lab, k) => {
    const cell = document.createElement('div');
    cell.className = 'mv-j';
    const head = document.createElement('div');
    head.className = 'lab';
    const name = document.createElement('span');
    name.textContent = ['Base', 'Shoulder', 'Elbow', 'Wrist'][k];
    const val = document.createElement('b');
    head.append(name, val);
    const sl = document.createElement('input');
    sl.type = 'range'; sl.min = mvLimits()[k][0]; sl.max = mvLimits()[k][1]; sl.step = 1; sl.value = 0;
    sl.setAttribute('aria-label', name.textContent);
    sl.addEventListener('input', () => {
      if (mv.playing) { mv.playing = false; updateMotionLabels(); }
      mv.pose[k] = Number(sl.value);
      applyMotionPose(mv.pose);
      showMotionValues();
    });
    cell.append(head, sl);
    if (levelWrist() && k === 3) {
      cell.classList.add('hidden');               // passive wrist: the parallel linkage drives it
    }
    mvUI.joints.appendChild(cell);
    mvUI.sliders.push(sl); mvUI.values.push(val);
  });
}

function showMotionValues() {
  mv.pose.forEach((d, k) => {
    const abs = mv.rig ? Math.round(d + mv.rig[k].rest * 180 / Math.PI) : Math.round(d);
    const txt = `${abs}°`;
    if (mvUI.values[k].textContent !== txt) mvUI.values[k].textContent = txt;
    const v = String(Math.round(d));   // runs every frame while playing: only touch the DOM on a change
    if (document.activeElement !== mvUI.sliders[k] && mvUI.sliders[k].value !== v) mvUI.sliders[k].value = v;
  });
}

function updateMotionLabels() {
  mvUI.play.innerHTML = mv.playing ? '&#x275A;&#x275A;' : '&#x25B6;';
  mvUI.speed.innerHTML = mv.speed === 1 ? '1&#xD7;' : (mv.speed === 0.5 ? '0.5&#xD7;' : '2&#xD7;');
  $('mv-live').style.visibility = mv.playing ? 'visible' : 'hidden';
}

function tickMotion(dt) {
  if (!mv.on || !mv.rig || !mv.playing || rp.data || poseLocked()) return;
  const routine = mvRoutine(), n = routine.length;
  const from = mv.resumeFrom || routine[mv.seg % n].d, step = routine[(mv.seg + 1) % n];
  if (mv.hold > 0) { mv.hold -= dt * mv.speed; return; }
  mv.t += dt * mv.speed;
  const u = Math.min(1, mv.t / step.t), s = minJerk(u);
  mv.pose = from.map((a, k) => a + (step.d[k] - a) * s);
  applyMotionPose(mv.pose);
  showMotionValues();
  if (u >= 1) { mv.seg = (mv.seg + 1) % n; mv.t = 0; mv.hold = MV_HOLD_S; mv.resumeFrom = null; }
}

function startMotion() {
  collapseExplode();
  mv.on = true;
  if (rp.data) return;            // a sim replay owns the joints; motion resumes when it closes
  disposeRig();                   // a restart (new rig, new model) rebuilds from scratch
  mv.rig = bindMotionRig();
  if (!mv.rig && rg.stored) { startRigMode(); return; }
  document.documentElement.style.removeProperty('--mv-bottom');
  setLoopControls(true, true);
  buildMotionUI();                // limits differ between serial and parallel-linkage arms
  mvUI.bar.classList.remove('hidden');
  document.body.classList.add('moving');
  if (!mv.rig) {
    // An assembly (GLB root "assembly") never has arm joint nodes: it just has no rig yet.
    setMvTitle(model && model.getObjectByName('assembly') ? 'No joints yet · use Re-rig'
      : 'Static model: no joint nodes in arm.glb (rebuild CAD)');
    mvUI.joints.classList.add('hidden');
    mv.playing = false;           // hides the live dot
  } else {
    setMvTitle(MV_TITLE);
    mvUI.joints.classList.remove('hidden');
    mv.seg = 0; mv.t = 0; mv.hold = 0; mv.playing = true; mv.resumeFrom = mv.pose.slice();
    applyMotionPose(mv.pose);
  }
  showMotionValues();
  updateMotionLabels();
  updateRigTags();
  if (mvUI.bar.classList.contains('folded')) layoutMotionBar();
}

function stopMotion(keepOn) {
  collapseExplode();
  disposeRig();
  if (mv.rig) mv.rig.forEach((j) => j.node.quaternion.copy(j.restQ));
  if (mv.rig && rp.coupled && !rp.data) rp.coupled.forEach((c) => c.node.quaternion.copy(c.node.userData.mechyRestQ));
  mv.rig = null;
  mv.on = !!keepOn;
  mv.pose = [0, 0, 0, 0];
  mvUI.bar.classList.add('hidden');
  document.body.classList.remove('moving');
  updateRigTags();
}

function toggleMotionPlay() {
  if (rg.rig) { toggleRigPlay(); return; }
  if (!mv.rig) return;
  mv.playing = !mv.playing;
  if (mv.playing) {
    // Resume the routine from the current pose: blend into the next waypoint.
    mv.t = 0; mv.hold = 0;
    mv.resumeFrom = mv.pose.slice();
  }
  updateMotionLabels();
}

mvUI.play.addEventListener('click', toggleMotionPlay);
mvUI.home.addEventListener('click', () => {
  if (rg.rig) { rigHome(); return; }
  mv.playing = false; mv.pose = [0, 0, 0, 0]; applyMotionPose(mv.pose); showMotionValues(); updateMotionLabels();
});
mvUI.speed.addEventListener('click', () => {
  mv.speed = mv.speed === 1 ? 2 : (mv.speed === 2 ? 0.5 : 1);
  updateMotionLabels();
});

// Fold: hide the joint sliders down to the bar's top row while the sim keeps running. Remembered
// per viewer page (browser storage may be unavailable: then it starts unfolded).
const MV_FOLD_KEY = 'mechy.mvFolded';
function readFold() { try { return localStorage.getItem(MV_FOLD_KEY) === '1'; } catch (e) { return false; } }
function setFold(folded) {
  mvUI.bar.classList.toggle('folded', folded);
  mvUI.fold.innerHTML = folded ? '&#x25B4;' : '&#x25BE;';
  mvUI.fold.title = folded ? 'Show the joint sliders' : 'Hide the joint sliders (the sim keeps running)';
  mvUI.fold.setAttribute('aria-expanded', folded ? 'false' : 'true');
  try { localStorage.setItem(MV_FOLD_KEY, folded ? '1' : '0'); } catch (e) { /* not remembered */ }
  if (!mvUI.bar.classList.contains('hidden')) layoutMotionBar();
}
mvUI.fold.addEventListener('click', () => setFold(!mvUI.bar.classList.contains('folded')));
setFold(readFold());

// Rigged Simulate ---------------------------------------------------------------
// With a rig (the parsed design/<variant>/joints.yaml, handed in by the app through setRig) and
// a model that has no arm joint nodes, Simulate builds the pivot hierarchy over the model's
// `assembly` node (rig.js), loops the saved poses and gives one slider per non-coupled joint.
// It reuses the motion bar: play / Home / speed work as in the arm sim, and the same pose lock
// (poseLocked / updatePoseLock) pauses and disables everything while the view is exploded.
const RG_FALLBACK_RANGE = { revolute: 180, prismatic: 100 };   // +- home, when a joint's limits are unusable
const RG_BLEND_MIN_S = 0.6, RG_BLEND_MAX_S = 2.5, RG_BLEND_SPEED = 60;   // deg/s or mm/s, as in the pose loop
const RG_STATUS_TAGS = {
  failed: 'Rig does not match the poses',
  unchecked: 'Unchecked rig',
  stale: 'Design changed since rigging',
};
const rg = {
  stored: null, json: '', status: 'ok',   // what the app handed in (kept across model reloads)
  rig: null, loop: null, kind: null,       // built over the current model; kind: 'rig' | 'empty' | 'unusable' | null
  t: 0, blend: null,                       // loop clock (s) and the blend from a hand pose back into the loop
  cur: {}, poseName: 'home', sliderJoints: [], note: '',
};
const rigTagsEl = $('rig-tags');
const isNumber = (v) => typeof v === 'number' && Number.isFinite(v);

/**
 * Slider range of a joint. `limits` comes from a file and is passed through rig.js unchecked:
 * a [min, max] pair of finite numbers with min < max is the range; min == max is a locked joint
 * (valid in rig-check), range [a, a] with its slider disabled (see buildRigUI); anything else
 * falls back to home +- 180 deg (revolute) or home +- 100 mm (prismatic). The range always
 * contains home so Home never shows a clamped thumb.
 */
function rigSliderRange(j) {
  const l = j.limits;
  let lo, hi;
  if (Array.isArray(l) && l.length >= 2 && isNumber(l[0]) && isNumber(l[1]) && l[0] <= l[1]) {
    [lo, hi] = l;
  } else {
    const r = RG_FALLBACK_RANGE[j.type] ?? 180;
    lo = j.home - r; hi = j.home + r;
  }
  return [Math.min(lo, j.home), Math.max(hi, j.home)];
}

const fmtJoint = (j, v) => (j.type === 'prismatic' ? `${Math.round(v * 10) / 10} mm` : `${Math.round(v)}°`);

function setLoopControls(loop, home) {
  mvUI.play.classList.toggle('hidden', !loop);
  mvUI.speed.classList.toggle('hidden', !loop);
  mvUI.home.classList.toggle('hidden', !home);
}

/** Put every part back, drop the pivots and forget the rig (the stored file stays). */
function disposeRig() {
  if (rg.rig) { try { rg.rig.dispose(); } catch (e) { /* the model is going away */ } }
  rg.rig = null; rg.loop = null; rg.kind = null; rg.blend = null; rg.cur = {}; rg.note = '';
}

function buildRigUI() {
  mvUI.joints.innerHTML = ''; mvUI.sliders = []; mvUI.values = []; mvUI.kind = 'rig';
  rg.sliderJoints = rg.rig.sliders.map((id) => rg.rig.joints.find((j) => j.id === id));
  for (const j of rg.sliderJoints) {
    const [lo, hi] = rigSliderRange(j);
    const cell = document.createElement('div');
    cell.className = 'mv-j';
    const head = document.createElement('div');
    head.className = 'lab';
    const name = document.createElement('span');
    name.textContent = j.label;
    name.title = j.label;
    name.style.cssText = 'overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;';
    const val = document.createElement('b');
    val.style.whiteSpace = 'nowrap';
    head.append(name, val);
    const sl = document.createElement('input');
    sl.type = 'range'; sl.min = lo; sl.max = hi; sl.step = hi - lo <= 30 ? 0.1 : 1; sl.value = j.home;
    sl.setAttribute('aria-label', j.label);
    if (lo === hi) { sl.dataset.locked = '1'; sl.disabled = true; sl.title = 'Locked joint'; }
    sl.addEventListener('input', () => {
      if (!rg.rig || poseLocked()) return;
      mv.playing = false; rg.blend = null; rg.poseName = 'manual';
      rg.cur[j.id] = Number(sl.value);
      rg.rig.setValues(rg.cur);
      showRigValues();
      updateMotionLabels();
      postRigPose(false);
    });
    sl.addEventListener('change', () => { if (rg.rig && !poseLocked()) postRigPose(true); });
    cell.append(head, sl);
    mvUI.joints.appendChild(cell);
    mvUI.sliders.push(sl); mvUI.values.push(val);
  }
}

function showRigValues() {
  rg.sliderJoints.forEach((j, k) => {
    const txt = fmtJoint(j, rg.cur[j.id]);
    if (mvUI.values[k].textContent !== txt) mvUI.values[k].textContent = txt;
    const v = String(rg.cur[j.id]);   // runs every frame while playing: only touch the DOM on a change
    if (document.activeElement !== mvUI.sliders[k] && mvUI.sliders[k].value !== v) mvUI.sliders[k].value = v;
  });
  setMvTitle(`Pose · ${rg.poseName}`);
}

/** Pose the rig at `values` (slider joints only) and note the pose name for the title. */
function applyRigValues(values, name) {
  Object.assign(rg.cur, values);
  rg.rig.setValues(rg.cur);
  rg.poseName = name;
  showRigValues();
}

function rigHome() {
  if (!rg.rig) return;
  mv.playing = false; rg.blend = null;
  applyRigValues(Object.fromEntries(rg.sliderJoints.map((j) => [j.id, j.home])), 'home');
  updateMotionLabels();
  postRigPose(true);
}

// A pose the user set by hand (sliders, Home) goes to the app, which can drive the real arm
// with it. At most ~12 per second while dragging; `final` when the thumb is let go.
let rigPoseTimer = null, rigPoseSent = 0;
function postRigPose(final) {
  const send = () => { rigPoseTimer = null; rigPoseSent = performance.now(); post({ type: 'rigPose', values: { ...rg.cur }, final }); };
  if (final) { clearTimeout(rigPoseTimer); send(); return; }
  if (rigPoseTimer) return;
  rigPoseTimer = setTimeout(send, Math.max(0, 80 - (performance.now() - rigPoseSent)));
}

function toggleRigPlay() {
  if (!rg.rig || !rg.loop || poseLocked()) return;
  mv.playing = !mv.playing;
  rg.postedTarget = null;
  if (mv.playing) {
    // Resume: blend from the current values into the loop, which is heading for its next waypoint.
    const target = rg.loop.sample(rg.t).values;
    const delta = Math.max(0, ...rg.sliderJoints.map((j) => Math.abs(target[j.id] - rg.cur[j.id])));
    rg.blend = { from: { ...rg.cur }, tau: 0, dur: Math.min(RG_BLEND_MAX_S, Math.max(RG_BLEND_MIN_S, delta / RG_BLEND_SPEED)) };
  }
  updateMotionLabels();
}

function tickRig(dt) {
  if (!rg.rig || !rg.loop || !mv.playing || rp.data || poseLocked()) return;
  const step = dt * mv.speed;
  rg.t = (rg.t + step) % rg.loop.duration;
  const s = rg.loop.sample(rg.t);
  // Playback drives the real arm waypoint by waypoint: post each one once, as the CAD heads for it.
  if (s.target && s.target !== rg.postedTarget) {
    rg.postedTarget = s.target;
    post({ type: 'rigPose', values: { ...s.target.values }, final: true, playback: true });
  }
  if (!rg.blend) { applyRigValues(s.values, s.name); return; }
  const b = rg.blend;
  b.tau += step;
  const u = Math.min(1, b.tau / b.dur), k = minJerk(u);
  applyRigValues(Object.fromEntries(rg.sliderJoints.map((j) => [j.id, b.from[j.id] + (s.values[j.id] - b.from[j.id]) * k])), s.name);
  if (u >= 1) rg.blend = null;
}

/** Status / missing-part / note tags in the top right. Only shown while a rig is simulating. */
function rigTags() {
  if (!mv.on || !rg.kind || rp.data) return [];
  const tags = [];
  if (RG_STATUS_TAGS[rg.status]) tags.push({ text: RG_STATUS_TAGS[rg.status], bad: rg.status === 'failed' });
  const n = rg.rig ? rg.rig.missing.length : 0;
  if (n) tags.push({ text: `${n} part${n === 1 ? '' : 's'} not in rig`, bad: false });
  if (rg.kind === 'rig' && rg.note) tags.push({ text: rg.note, bad: false, note: true });
  return tags;
}

function updateRigTags() {
  const tags = rigTags();
  rigTagsEl.replaceChildren(...tags.map((t) => {
    const el = document.createElement('span');
    el.className = 'tag' + (t.bad ? ' bad' : '') + (t.note ? ' note' : '');
    el.textContent = t.text;
    return el;
  }));
  rigTagsEl.classList.toggle('hidden', !tags.length);
}

/** Keep dims / legend clear of the bar when its sliders wrap onto more rows. */
function layoutMotionBar() {
  const h = mvUI.bar.classList.contains('hidden') ? 0 : mvUI.bar.offsetHeight;
  document.documentElement.style.setProperty('--mv-bottom', (h + 26) + 'px');
}

/** Build the stored rig over the loaded model and show its controls (called by startMotion). */
function startRigMode() {
  const root = model ? (model.getObjectByName('assembly') || model) : null;
  let rig = null;
  if (root) {
    try { rig = buildRig(root, rg.stored); } catch (e) { rig = null; console.warn('Mechy rig could not be built', e); }
  }
  mvUI.bar.classList.remove('hidden');
  document.body.classList.add('moving');
  rg.rig = rig;
  rg.t = 0; rg.blend = null;
  rg.note = typeof rg.stored.note === 'string' ? rg.stored.note.trim() : '';
  if (!rig) {
    const none = !root ? 'waiting' : (Array.isArray(rg.stored.joints) && rg.stored.joints.length === 0 ? 'empty' : 'unusable');
    rg.kind = none === 'waiting' ? null : none;
    mvUI.kind = null; mvUI.joints.innerHTML = ''; mvUI.sliders = []; mvUI.values = [];
    mvUI.joints.classList.add('hidden');
    setLoopControls(false, false);
    mv.playing = false;
    setMvTitle(none === 'waiting' ? 'Rig ready · waiting for the model'
      : (none === 'empty' ? `No moving joints${rg.note ? ' · ' + rg.note : ''}` : 'No usable joints in this rig'));
  } else {
    rg.kind = 'rig';
    rg.cur = rig.values();
    rg.poseName = 'home';
    buildRigUI();
    mvUI.joints.classList.remove('hidden');
    const hasLoop = rig.poses.length > 0 && rig.sliders.length > 0;
    rg.loop = hasLoop ? poseLoop(rig) : null;
    setLoopControls(hasLoop, true);
    mv.playing = hasLoop;
    showRigValues();
  }
  updateMotionLabels();
  updateRigTags();
  layoutMotionBar();
}


// Exploded view -----------------------------------------------------------
// Parts slide apart along the line from the model centre to their own centre (rig.js).
// While exploded the motion sim / replay is paused and its controls are disabled, so explode
// offsets never compose with a moving pose; collapsing (slider to 0 or setExplode(false))
// restores the exact pose and re-enables them. Anything that changes the pose or the model
// collapses first.
const EX_DEFAULT = 0.6;
const EX_COLLAPSE_S = 0.3;
const ex = { on: false, factor: 0, state: null, anim: null };   // factor 0..1; anim = collapsing back to 0
const exUI = { bar: $('ex-bar'), slider: $('ex-slider'), val: $('ex-val') };

/** True while parts are away from their home positions (including the 0.3 s collapse).
 *  With the bar open and the slider at 0% nothing is displaced, so the pose may move again. */
function poseLocked() { return ex.factor > 0; }

let exPosted = false;
/** Tell the host whenever the exploded view turns on or off (its Explode toggle follows). */
function announceExplode() {
  if (ex.on === exPosted) return;
  exPosted = ex.on;
  post({ type: 'explode', on: ex.on });
}

function partNodeNames() {
  const names = new Set();
  for (const part of partList) for (const n of part.names) names.add(n);
  return [...names];
}

/** Disable / re-enable everything that would move the pose. */
function updatePoseLock() {
  const lock = poseLocked();
  for (const sl of mvUI.sliders) sl.disabled = lock || sl.dataset.locked === '1';
  mvUI.play.disabled = mvUI.home.disabled = lock;
  if (rp.data) updateReplayLabels();
}

/** The explode bar sits above the motion / replay bar, whichever is showing. */
function layoutExplodeBar() {
  let bottom = 10;
  for (const el of [mvUI.bar, ui.bar]) if (!el.classList.contains('hidden')) bottom = Math.max(bottom, 10 + el.offsetHeight + 6);
  document.documentElement.style.setProperty('--ex-bottom', bottom + 'px');
}

function showExplodeBar(on) {
  exUI.bar.classList.toggle('hidden', !on);
  document.body.classList.toggle('exploding', on);
  if (on) layoutExplodeBar();
}

function setExplodeFactor(f) {
  ex.factor = f;
  if (model && ex.state) applyExplode(model, ex.state, f);
  const pct = Math.round(f * 100);
  exUI.val.textContent = `${pct}%`;
  if (document.activeElement !== exUI.slider) exUI.slider.value = String(pct);
}

/** Back to the unexploded pose at once (no animation). Safe to call any time. */
function collapseExplode() {
  if (!ex.on && !ex.state && !ex.anim) return;
  ex.on = false; ex.anim = null;
  if (ex.factor > 0) setExplodeFactor(0);   // at 0% nothing is displaced, and the capture may be stale
  ex.factor = 0; ex.state = null;
  showExplodeBar(false);
  updatePoseLock();
  announceExplode();
}

function setExplode(on) {
  if (!on) {
    if (!ex.on) return;
    ex.on = false;
    announceExplode();
    showExplodeBar(false);
    if (ex.factor > 0) ex.anim = { from: ex.factor, t: 0 };
    else collapseExplode();
    return;
  }
  if (!model) { exPosted = false; post({ type: 'explode', on: false }); return; }   // nothing to explode: tell the host
  if (ex.on) return;
  if (ex.anim && ex.state) {
    ex.anim = null;                                       // re-opened mid-collapse: same pose, keep the capture
  } else {
    ex.state = explodeOffsets(model, partNodeNames());    // captured at the current pose, nothing exploded
    ex.factor = 0;
  }
  ex.on = true;
  setExplodeFactor(ex.factor > 0 ? ex.factor : EX_DEFAULT);
  exUI.slider.value = String(Math.round(ex.factor * 100));   // the bar was closed: nothing is dragging it
  showExplodeBar(true);
  updatePoseLock();
  announceExplode();
}

function tickExplode(dt) {
  if (!ex.anim) return;
  ex.anim.t += dt;
  const u = Math.min(1, ex.anim.t / EX_COLLAPSE_S);
  setExplodeFactor(ex.anim.from * (1 - minJerk(u)));
  if (u >= 1) collapseExplode();
}

exUI.slider.addEventListener('input', () => {
  if (!ex.on) return;
  const f = Number(exUI.slider.value) / 100;
  // Leaving 0%: the pose may have changed while the controls were free, so capture again first.
  if (ex.factor === 0 && f > 0 && model) ex.state = explodeOffsets(model, partNodeNames());
  setExplodeFactor(f);
  updatePoseLock();   // 0% frees the motion / replay controls, anything above locks them again
});

function decodeBase64Text(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

/** XHR rather than fetch(): WebKit lets XHR read file:// URLs under the read-access grant. */
function loadReplayURL(url, stamp, title) {
  const xhr = new XMLHttpRequest();
  const fail = (why) => post({ type: 'replayFailed', url, error: why });
  try {
    xhr.open('GET', url, true);   // file:// ignores cache-busting; WebKit reloads from disk
    xhr.responseType = 'text';
    xhr.onload = () => {
      if ((xhr.status === 200 || xhr.status === 0) && xhr.responseText) {
        let obj;
        try { obj = JSON.parse(xhr.responseText); } catch (e) { fail('parse: ' + e.message); return; }
        setReplay(obj, title);
      } else {
        fail('status ' + xhr.status);
      }
    };
    xhr.onerror = () => fail('xhr error');
    xhr.send();
  } catch (e) {
    fail(String(e && e.message || e));
  }
}

let lastURL = null;
window.mechy = {
  /** Put the rigged model in its home pose (and report it, like the Home button). */
  rigHome() { rigHome(); },
  load(url, stamp) {
    lastURL = url;
    loadProjectData(url);
    setStatus('Loading model');
    const busted = stamp ? `${url}#${stamp}` : url;
    loader.load(busted, onLoaded, undefined, (err) => {
      setStatus('Loading model…');
      post({ type: 'loadFailed', url, error: String(err && err.message || err) });
    });
  },
  loadBase64(b64) {
    try {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      loadProjectData(null);
      loader.parse(bytes.buffer, '', onLoaded, (err) => setStatus('Could not read model'));
    } catch (e) {
      setStatus('Could not read model');
    }
  },
  setShaded(on) { shaded = !!on; applyStyle(); },
  setTheme(mode) {
    themeMode = (mode === 'light' || mode === 'dark') ? mode : 'system';
    if (themeMode === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', themeMode);
    restyle();
  },
  fit,
  loadReplay(url, stamp, title) { loadReplayURL(url, stamp, title); },
  loadReplayBase64(b64, title) {
    let obj;
    try { obj = JSON.parse(decodeBase64Text(b64)); } catch (e) {
      setStatus('Could not read replay.json');
      post({ type: 'replayFailed', error: String(e && e.message || e), parse: true });
      return;
    }
    setReplay(obj, title);
  },
  loadReplayData(obj, title) { setReplay(obj, title); },
  closeReplay,
  /** Exploded view: shows / hides the Explode slider (60% when turned on); off animates back over 0.3 s. */
  setExplode,
  explodeState() { return { on: ex.on, factor: ex.factor }; },
  /** Legend rows currently hidden (keys), for tests and debugging. */
  visibility() { return { hidden: [...hiddenKeys] }; },
  /** Show every part again (the panel calls this when the variant changes). */
  resetVisibility() { hiddenKeys.clear(); applyVisibility(); },
  /** Inspection HUD. tool: "select" | "point" | "edge"; study: null | "mass" | "material" | "load";
   *  section: null | {axis: "x" | "y" | "z", t: 0..1, flip}; view: "front" | "top" | "iso" | ... */
  setTool(t) { setTool(t); },
  /** Electronics layer: show / hide, state for tests, pick a cable by id. */
  setWiring(on) { setWiring(on); },
  wiringState() {
    return { on: wr.on, components: wr.plan ? wr.plan.components.map((c) => ({ id: c.id, kind: c.kind, placed: !c.node, pins: c.pins.length })) : [],
             cables: wr.cables.map((c) => ({ id: c.cable.id, label: c.cable.label, lengthMM: wr.lengths[c.cable.id], points: c.route.length })),
             notes: wr.plan ? wr.plan.notes : [], bom: wr.bom.map((b) => ({ item: b.item, qty: b.qty, inBOM: b.inBOM })) };
  },
  selectWire(id) {
    const c = wr.cables.find((x) => x.cable.id === id);
    if (!c) return;
    pinPart(null); sel.node = null; sel.wire = { type: 'cable', cable: c.cable };
    applyWiringStyle(); renderInspector(); updateBracket();
  },
  /** CAD-BOM links (JSON text or object; null clears). Re-tints drifting parts and refreshes legend and inspector. */
  setLinks(obj) {
    try { links = typeof obj === 'string' ? JSON.parse(obj) : obj || null; } catch (e) { links = null; }
    if (model) { decorateLegend(); applyStyle(); if (nodes.size) renderInspector(); }
    invalidate();
  },
  /** Re-read print_list / bom / mass_props / loads (the app calls this after writing bom.csv). */
  reloadProjectData() { if (lastURL) loadProjectData(lastURL); },
  /** Zoom to a part by node name (instant: no 0.45 s animation). */
  focus(name, instant) { const n = nodes.get(name); if (n) focusNode(n, instant); },
  setStudy(m) { setStudy(m); },
  setSection(s) { if (!s) setSection(false); else { Object.assign(sec, s); setSection(true); } },
  setOrtho(on) { setOrtho(!!on); },
  view(name) { if (VIEWS[name]) viewDir(VIEWS[name]); },
  select(name) { const n = model && model.getObjectByName(name); let m = null; n && n.traverse((o) => { if (!m && o.isMesh && o.userData.part) m = o; }); pinPart(m ? m.userData.part : null); selectNode(m); },
  /** Test/debug: the edge measurement under client point (x, y), as the Edge tool would read it. */
  edgeAt(x, y) {
    const e = { clientX: x, clientY: y };
    const ed = model && nearestEdge(e, hitsAt(e));
    if (!ed) return null;
    const c = edgeChain(ed.segs, ed.seg, { weld: modelRadius() * 1e-6 });
    const deg = new Map();
    const key = (i) => [0, 1, 2].map((k) => Math.round(ed.segs[i + k] / (modelRadius() * 1e-6))).join();
    for (let i = 0; i < ed.segs.length; i += 3) deg.set(key(i), (deg.get(key(i)) || 0) + 1);
    const hist = {};
    for (const d of deg.values()) hist[d] = (hist[d] || 0) + 1;
    return { mesh: ed.mesh.name, segs: ed.segs.length / 6, kind: c.kind, text: measureText({ type: 'edge', chain: c }), points: c.points.length, degrees: hist };
  },
  /** Test/debug: what the HUD shows. */
  inspectState() {
    return { tool, study: st.mode, section: sec.on ? { axis: sec.axis, t: sec.t, flip: sec.flip } : null, ortho: camera === orthoCam,
             selected: sel.node ? sel.node.name : null, info: sel.info, measurements: meas.list.map(measureText),
             data: { print: projectData.print.length, bom: projectData.bom.length, mass: !!projectData.mass, loads: !!projectData.loads },
             load: st.load ? { peakNm: st.load.peak, peakMm: st.load.peakS * unitMM() } : null, totals: assemblyTotals() };
  },
  /** Motion sim on/off (demo routine + joint sliders). */
  setMotion(on) { if (on) startMotion(); else stopMotion(false); },
  /** Rigged Simulate: `obj` is the parsed joints.yaml (or null), status "ok" | "failed" | "unchecked" | "stale".
   *  Stored and re-applied to every model load; rebuilt now when motion is on and the file changed. */
  setRig(obj, status) {
    const next = obj && typeof obj === 'object' && !Array.isArray(obj) ? obj : null;
    let json = '';
    try { json = next ? JSON.stringify(next) : ''; } catch (e) { /* cyclic: treat as a new rig every time */ }
    const same = !!rg.stored && !!next && json !== '' && json === rg.json;
    const had = !!rg.stored;
    rg.stored = next; rg.json = json;
    rg.status = Object.prototype.hasOwnProperty.call(RG_STATUS_TAGS, status) ? status : 'ok';
    if (!mv.on || rp.data || mv.rig) return;    // off, a replay owns the joints, or the arm sim runs (it ignores rigs)
    if (same && rg.kind) { updateRigTags(); return; }   // only the status changed: keep the loop going
    if (had || next) startMotion();
  },
  /** Test/debug: rigged Simulate state. `pose` is the pose name (or "manual"), `values` every joint's value. */
  rigState() {
    return {
      on: !!rg.kind, kind: rg.kind, playing: !!(rg.rig && rg.loop && mv.playing), speed: mv.speed,
      pose: rg.rig ? rg.poseName : null, values: rg.rig ? rg.rig.values() : null,
      missing: rg.rig ? rg.rig.missing.slice() : [], problems: rg.rig ? rg.rig.problems.slice() : [],
      status: rg.status, title: mvUI.text.textContent, tags: rigTags().map((t) => t.text),
    };
  },
  motionState() { return { on: mv.on, playing: mv.playing, animated: !!mv.rig, pose: mv.pose.slice() }; },
  /** Test/debug: pose the arm at joint degrees [base, shoulder, elbow, wrist] and read a node's
   * world position in the arm frame (metres). */
  poseArm(qDeg) { if (rp.rig) applyPose(qDeg.map((d) => d * Math.PI / 180)); },
  nodeWorld(name) {
    const n = model && model.getObjectByName(name);
    if (!n) return null;
    scene.updateMatrixWorld(true);
    const v = n.getWorldPosition(new THREE.Vector3());
    return (rp.frame ? rp.frame.worldToLocal(v.clone()) : v).toArray();
  },
  nodeNames() { const out = []; model && model.traverse((o) => o.name && out.push(o.name)); return out; },
  /** Read-only snapshot for tests and debugging: throw, time, and the hand origin in the arm frame. */
  replayState() {
    const th = currentThrow();
    let hand = null;
    if (rp.rig && rp.frame) {
      rp.frame.updateMatrixWorld(true);
      const w = rp.rig[3].node.getWorldPosition(new THREE.Vector3());
      hand = rp.frame.worldToLocal(w).toArray();
    }
    return th ? { index: rp.index, id: th.id, outcome: th.outcome, t: rp.t, playing: rp.playing, speed: rp.speed,
                  animated: !!rp.rig, rest: rp.rig ? rp.rig.map((j) => j.rest) : null, hand } : null;
  },
};
// Every call from the app (evaluateJavaScript) can change what is on screen: draw after it.
for (const [name, fn] of Object.entries(window.mechy)) {
  if (typeof fn !== 'function') continue;
  window.mechy[name] = function (...args) {
    try { return fn.apply(this, args); } finally { invalidate(); }
  };
}

// Inspection HUD ----------------------------------------------------------------
// Read-only tools over the loaded model: an inspector (size, volume, mass and material, from
// the variant's print_list.csv / bom.csv / mass_props.json / loads.json when they sit next to
// the GLB), a view cube with standard views and an orthographic camera, a section cut with
// hatched caps, point / edge measurement, and three studies (mass, material, gravity load).
// Nothing here edits the design.
const hud = { toolbar: $('toolbar'), insp: $('insp'), cube: $('cube-wrap'), labels: $('mlabels') };
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const _a = new THREE.Vector3(), _b = new THREE.Vector3(), _c = new THREE.Vector3();

let unitScale = 1000;   // mm per model unit (glTF metres; showDims takes a huge model as millimetres)
const unitMM = () => unitScale;
const fmtNum = (x, big = 100) => (x >= big ? x.toFixed(0) : x >= 10 ? x.toFixed(1) : x.toFixed(2));
const fmtMM = (u) => fmtNum(u * unitScale);
const fmtG = (g) => (g >= 1000 ? `${(g / 1000).toFixed(2)} kg` : `${g >= 100 ? g.toFixed(0) : g.toFixed(1)} g`);
const isVirtual = (name) => /keep-?out|envelope|clearance|workspace|reach/i.test(name);

/** Raw (display) colour as a vec3, for shader code that writes after colour-space conversion. */
const hexVec = (hex, v = new THREE.Vector3()) => v.set(((hex >> 16) & 255) / 255, ((hex >> 8) & 255) / 255, (hex & 255) / 255);
function turbo(x) {
  x = Math.min(1, Math.max(0, x));

  const g = 0.09140261 + x * (2.19418839 + x * (4.84296658 + x * (-14.18503333 + x * (4.27729857 + x * 2.82956604))));
  const b = 0.10667330 + x * (12.64194608 + x * (-60.58204836 + x * (110.36276771 + x * (-89.90310912 + x * 27.34824973))));
  return [r, g, b].map((c) => Math.min(1, Math.max(0, c)));
}
const TURBO_GLSL = `vec3 turbo(float x) {
  x = clamp(x, 0.0, 1.0);
  vec4 v4 = vec4(1.0, x, x * x, x * x * x); vec2 v2 = v4.zw * v4.z;
  return clamp(vec3(
    dot(v4, vec4(0.13572138, 4.61539260, -42.66032258, 132.13108234)) + dot(v2, vec2(-152.94239396, 59.28637943)),
    dot(v4, vec4(0.09140261, 2.19418839, 4.84296658, -14.18503333)) + dot(v2, vec2(4.27729857, 2.82956604)),
    dot(v4, vec4(0.10667330, 12.64194608, -60.58204836, 110.36276771)) + dot(v2, vec2(-89.90310912, 27.34824973))), 0.0, 1.0);
}`;

// Section caps: with a cut on, back faces seen through the opening are drawn as a hatched
// solid, so a cut part reads as material instead of a hollow shell.
const capUniforms = { uCapOn: { value: 0 }, uCapColor: { value: hexVec(0x8fcdf5) } };
const CAP_DECL = 'uniform float uCapOn; uniform vec3 uCapColor;';
const CAP_CODE = `if (uCapOn > 0.5 && !gl_FrontFacing) {
  float hatch = step(0.5, fract((gl_FragCoord.x + gl_FragCoord.y) / 9.0));
  gl_FragColor = vec4(mix(uCapColor, uCapColor * 0.74, hatch), 1.0);
}`;
function withCap(mat) {
  mat.onBeforeCompile = (sh) => {

      .replace('#include <dithering_fragment>', '#include <dithering_fragment>\n' + CAP_CODE);

}

// Project data ------------------------------------------------------------------
const emptyData = () => ({ print: [], bom: [], mass: null, loads: null, wiring: null });
let projectData = emptyData();
let dataGen = 0;
function readText(url) {
  return new Promise((res) => {
    try {
      const xhr = new XMLHttpRequest();   // XHR: WebKit lets it read file:// under the read-access grant
      xhr.open('GET', url, true);
      xhr.responseType = 'text';
      xhr.onload = () => res((xhr.status === 200 || xhr.status === 0) && xhr.responseText ? xhr.responseText : null);
      xhr.onerror = () => res(null);
      xhr.send();
    } catch (e) { res(null); }
  });
}
/** Read the files the engine writes next to the GLB (all optional). */
async function loadProjectData(url) {
  const gen = ++dataGen;
  projectData = emptyData();
  if (!url) return;
  const dir = String(url).split('#')[0].replace(/[^/]*$/, '');
  const texts = await Promise.all(['print_list.csv', 'bom.csv', 'mass_props.json', 'loads.json', 'wiring.json'].map((f) => readText(dir + f)));
  if (gen !== dataGen) return;
  const json = (t) => { try { return t ? JSON.parse(t) : null; } catch (e) { return null; } };
  projectData = { print: parseCSV(texts[0]), bom: parseCSV(texts[1]), mass: json(texts[2]), loads: json(texts[3]), wiring: json(texts[4]) };
  if (model && nodes.size) {
    assignMasses();
    // The project's wiring.json replaces the guessed harness: rebuild it if the guess was drawn first.
    if (wr.plan && projectData.wiring && !wr.plan.fromSpec) buildHarness();
    else if (wr.plan) wr.bom = harnessBOM(wr.plan, wr.lengths, projectData.bom);
    refreshHUD();
  }
  invalidate();   // a study's colours may have changed
}

// Nodes: one per named part, with geometry stats taken once at load -------------------
let nodes = new Map();   // node name -> { name, meshes, part, volume, area, tris, local centroid, est, ... }
const nodeOf = (mesh) => (mesh ? nodes.get(partName(mesh)) : null);
function computeNodes() {
  nodes = new Map();
  model.updateMatrixWorld(true);
  for (const part of partList) for (const m of part.meshes) {
    const name = partName(m);
    if (!nodes.has(name)) nodes.set(name, { name, meshes: [], part, signed: 0, area: 0, tris: 0, cw: new THREE.Vector3() });
    const n = nodes.get(name), s = meshStats(m);
    m.userData.stats = s;
    n.meshes.push(m);
    n.signed += s.signed; n.area += s.area; n.tris += s.tris;
    n.cw.add(s.moment);
  }
  for (const n of nodes.values()) {
    n.virtual = isVirtual(n.name);
    n.volume = Math.abs(n.signed);
    // Centroid kept in the first mesh's frame so it follows the part when posed or exploded.
    n.local = n.volume > 1e-18 ? n.meshes[0].worldToLocal(n.cw.divideScalar(n.signed).clone()) : null;
  }
  assignMasses();
}
function bodyFor(mesh) {
  const bodies = projectData.mass && projectData.mass.bodies;
  if (!bodies) return null;
  const keys = Object.keys(bodies);
  for (let o = mesh; o && o !== model.parent; o = o.parent) {
    const k = o.name && keys.find((b) => normName(b) === normName(o.name));
    if (k) return { name: k, ...bodies[k] };
  }
  return null;
}
function assignMasses() {
  for (const n of nodes.values()) {
    const kind = KIND_COLORS.find((k) => k.re.test(n.name));
    n.kind = /belt/i.test(n.name) ? 'Belts' : kind ? kind.label : null;
    n.look = lookupPart(projectData, n.name, kind ? kind.re : null);
    n.body = n.look.body || bodyFor(n.meshes[0]);
    n.cm3 = n.volume * unitScale ** 3 / 1000;
    n.est = n.virtual ? { grams: null, source: null, material: null } : estimateMass(n.look, n.cm3, n.kind);
    n.material = n.virtual ? null : (n.est.material || (n.kind && KIND_MATERIAL[n.kind] ? KIND_MATERIAL[n.kind].material : null));
  }
  st.samples = null;
}
function hoverMass(mesh) {
  const n = nodeOf(mesh);
  return n && n.est && n.est.grams ? ` · ${fmtG(n.est.grams)}` : '';
}
function assemblyTotals() {
  let grams = 0, parts = 0, printed = 0, unknown = 0;
  for (const n of nodes.values()) {
    if (n.virtual) continue;
    parts++;
    if (n.look && n.look.print) printed++;
    if (n.est && n.est.grams) grams += n.est.grams; else unknown++;
  }
  const num = (v) => { const x = parseFloat(v); return Number.isFinite(x) ? x : 0; };
  const cost = projectData.bom.reduce((t, r) => t + (num(r.qty) || 1) * num(r.est_unit_usd), 0);
  const filament = projectData.print.reduce((t, r) => t + (r.est_grams_total ? num(r.est_grams_total) : num(r.est_grams) * (num(r.qty) || 1)), 0);
  let worst = null;
  for (const j of (projectData.loads && projectData.loads.joints) || []) {
    if (typeof j.safety_factor_static === 'number' && (!worst || j.safety_factor_static < worst.safety_factor_static)) worst = j;
  }
  return { parts, printed, grams, unknown, cost, filament,

/** Bounds of a node's meshes as they are posed now. */
function nodeBox(n, box = new THREE.Box3()) {
  box.makeEmpty();
  for (const m of n.meshes) box.expandByObject(m);
  return box;
}

const sel = { node: null, info: null, wire: null };   // wire: a picked harness cable / board
const overlayMat = (color, opts = {}) => new THREE.LineBasicMaterial({ color, depthTest: false, transparent: true, ...opts });

bracket.geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(24 * 2 * 3 + 6 * 3), 3));
bracket.renderOrder = 998; bracket.visible = false; bracket.frustumCulled = false; bracket.raycast = () => {};
scene.add(bracket);
const _box = new THREE.Box3();

function updateBracket() {
  if (!sel.node || !model || sel.node.meshes.every((m) => !m.visible)) { bracket.visible = false; return; }
  nodeBox(sel.node, _box);
  if (_box.isEmpty()) { bracket.visible = false; return; }
  const pos = bracket.geometry.attributes.position.array;
  const mn = _box.min, mx = _box.max;
  const len = [mx.x - mn.x, mx.y - mn.y, mx.z - mn.z].map((d) => Math.max(d * 0.22, 1e-6));
  let k = 0;
  const push = (x, y, z) => { pos[k++] = x; pos[k++] = y; pos[k++] = z; };
  for (const x of [mn.x, mx.x]) for (const y of [mn.y, mx.y]) for (const z of [mn.z, mx.z]) {
    const sx = x === mn.x ? 1 : -1, sy = y === mn.y ? 1 : -1, sz = z === mn.z ? 1 : -1;
    push(x, y, z); push(x + sx * len[0], y, z);
    push(x, y, z); push(x, y + sy * len[1], z);
    push(x, y, z); push(x, y, z + sz * len[2]);
  }
  // Centre-of-mass cross.
  const n = sel.node;
  if (n.local) {
    _c.copy(n.local).applyMatrix4(n.meshes[0].matrixWorld);
    const r = Math.min(...len) * 0.35;
    push(_c.x - r, _c.y, _c.z); push(_c.x + r, _c.y, _c.z);
    push(_c.x, _c.y - r, _c.z); push(_c.x, _c.y + r, _c.z);
    push(_c.x, _c.y, _c.z - r); push(_c.x, _c.y, _c.z + r);
  } else {
    for (let i = 0; i < 6; i++) push(mn.x, mn.y, mn.z);
  }
  bracket.geometry.attributes.position.needsUpdate = true;
  bracket.visible = true;
}

function selectNode(mesh) {
  sel.node = nodeOf(mesh) || null;

  renderInspector();
  updateBracket();
}

function partHTML(n) {

  const group = n.part && n.part.label !== prettyName(n.name) && n.part.label !== n.kind ? n.part.label : '';
  const kindText = n.virtual ? 'Reference volume' : n.kind ? `Bought · ${n.kind}` : n.look.print ? 'Printed part' : 'Part';
  const share = n.est.grams && t.grams ? n.est.grams / t.grams : 0;
  const massText = n.est.grams ? `${fmtG(n.est.grams)}${share ? ` <small>${(share * 100).toFixed(share < 0.1 ? 1 : 0)} % of total</small>` : ''}`

  const bom = n.look.bom.slice(0, 6).map((r) => `<dt>${esc(r.qty || 1)} ×</dt><dd>${esc(r.item)}${r.est_unit_usd ? ` <small>$${esc(r.est_unit_usd)}</small>` : ''}</dd>`).join('');

      ${dlRow('Infill', esc(pr.infill || ''))}
      ${dlRow('Print', esc(pr.orientation || ''))}
      ${dlRow('Volume', n.cm3 ? `${fmtNum(n.cm3)} <small>cm³ solid</small>` : null)}
      ${dlRow('Area', n.area ? `${fmtNum(n.area * unitScale ** 2 / 100)} <small>cm²</small>` : null)}
      ${dlRow('Qty', esc(pr.qty || (n.part && n.part.names.size > 1 ? `${n.part.names.size} in this group` : '')))}

}

function assemblyHTML() {
  const t = assemblyTotals();
  const heavy = [...nodes.values()].filter((n) => !n.virtual && n.est.grams).sort((a, b) => b.est.grams - a.est.grams).slice(0, 6);
  const max = heavy.length ? heavy[0].est.grams : 1;
  const sf = t.minSF;
  const sfText = sf ? `<span class="${sf.static < 2 ? 'bad' : 'good'}">×${sf.static.toFixed(1)}</span> <small>${esc(sf.joint)} static${sf.atSpeed ? `, ×${sf.atSpeed.toFixed(1)} at speed` : ''}</small>` : null;
  const box = visibleBox();
  const rows = heavy.map((n) => `<dt class="clip" style="cursor:pointer" data-node="${esc(n.name)}" title="${esc(prettyName(n.name))}">${esc(prettyName(n.name))}</dt>
      <dd style="cursor:pointer" data-node="${esc(n.name)}">${fmtG(n.est.grams)}<div class="bar"><i style="width:${(n.est.grams / max * 100).toFixed(1)}%"></i></div></dd>`).join('');
  const data = [projectData.print.length && 'print list', projectData.bom.length && 'BOM', projectData.mass && 'mass props', projectData.loads && 'loads'].filter(Boolean);
  return `<div class="ih"><div style="flex:1"><div class="nm">Assembly</div>
      <div class="sub">${data.length ? `from ${esc(data.join(' · '))}` : 'geometry only'}</div></div></div>
    <dl>
      ${dlRow('Parts', `${t.parts}${t.printed ? ` <small>${t.printed} printed</small>` : ''}`)}
      ${dlRow('Envelope', sizeText(box))}
      ${dlRow('Mass', t.grams ? `${fmtG(t.grams)} <small>est.${t.unknown ? `, ${t.unknown} unknown` : ''}</small>` : null)}
      ${dlRow('Filament', t.filament ? `${fmtG(t.filament)}` : null)}
      ${dlRow('BOM cost', t.cost ? `$${t.cost.toFixed(0)}` : null)}
