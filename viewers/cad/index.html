<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mechy CAD viewer</title>
<!--
  Mechy CAD viewer (docs/architecture/ui-style.md, "3D viewer"):
  paper background + grid, flat light-grey surfaces with black edge outlines
  (technical illustration), optional shaded mode. three.js is vendored from npm (version in vendor/three/package.json).

  Swift -> JS:  window.mechy.load(fileURL, stamp), loadBase64(b64), setShaded(bool), fit(),
                setTheme("system" | "light" | "dark")   (app appearance: System / Paper / Graphite)
                loadReplay(fileURL, stamp, title), loadReplayBase64(b64, title), loadReplayData(obj, title),
                closeReplay()   (sim theater, contracts.md section 11: sim/<task>/replay.json)
                setExplode(bool)   exploded view: shows/hides an Explode slider (0-100, 60 when turned on);
                                   turning off animates back to 0 over 0.3 s
                resetVisibility()  show every part again (the panel calls it when the variant changes)
                window.__mechyTheme is set by a document-start user script for the first paint.
                Part legend: click a coloured square to hide/show that row, option-click to show only
                that row (again to show all); hidden rows are kept across reloads of the same parts.
                setRig(obj | null, status)   rigged Simulate: obj is the parsed joints.yaml, status "ok" |
                                   "failed" | "unchecked" | "stale" (tag in the top right). Stored; with
                                   setMotion(true) and a model that has no arm joint nodes (turntable,
                                   upper_arm, forearm, hand) the viewer builds the rig over the model's
                                   `assembly` node, loops the saved poses and shows one slider per joint.
                                   A model with arm joint nodes keeps the arm sim and ignores the rig.
                setLinks(json | obj)   CAD-BOM links, {parts: {<partId>: {component, name, status, price, vendor,
                                   url, image, drift, chosen, placeholder}}} (BomLinks.viewerJSON; null clears).
                                   The inspector gets a "BOM" block for a linked part; legend rows get an amber "!"
                                   when the part drifted from the chosen item and "rough model" for placeholders;
                                   drifting meshes get an amber tint (0xE8A33A, emissive 0.35) until links change.
  Inspection HUD (read-only; inspect.js holds the maths): toolbar Inspect / Measure / Edge / Section /
                Study, a view cube (click a face, edge or corner; Iso, Persp/Ortho, Fit) and an inspector
                (assembly totals, or the clicked part's size, mass, material, print settings and BOM rows,
                read from print_list.csv, bom.csv, mass_props.json and loads.json next to the GLB when
                load(url) can reach them). Wiring: a wiring.json next to the GLB (wiring.js planFromSpec)
                replaces the harness guessed from part names. Keys: V M E X L O F I H (shift-H all), 0 1 3 7 views, Esc.
                setTool("select" | "point" | "edge"), setStudy(null | "mass" | "material" | "load"),
                setSection(null | {axis, t, flip}), setOrtho(bool), view(name), select(nodeName),
                focus(nodeName, instant)
  Debug:        explodeState() -> {on, factor}, visibility() -> {hidden: [row keys]},
                inspectState() -> {tool, study, section, selected, info, measurements, totals, ...},
                edgeAt(x, y) -> what the Edge tool reads under a client point,
                rigState() -> {on, playing, pose, values, missing, ...}
  JS -> Swift:  webkit.messageHandlers.mechy.postMessage({type: "ready" | "loaded" | "loadFailed" |
                "replayLoaded" | "replayFailed" | "explode" | "openBOM" | "openURL", ...})
                {type: "openBOM", component} is the inspector's "Open in BOM" button (the app shows its BOM
                panel, scrolls to that item's card and flashes it);
                {type: "openURL", url} the BOM block's store link (the app opens http(s) URLs in the browser).
                {type: "explode", on: bool} is posted whenever the exploded view turns on or off, for
                any reason: setExplode, slider-less auto-collapse (model reload, setMotion on/off, replay
                attach/detach/close), and a setExplode(true) that is ignored because no model is loaded
                (on: false). The host's Explode toggle should follow it.
-->
<style>
  :root {
    --paper: #ECECEA; --surface: #F5F5F3; --ink: #1C1C1C; --muted: #6B6B6B;
    --grid: rgba(28, 28, 28, 0.10);
    color-scheme: light dark;
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] {
    --paper: #1A1A1A; --surface: #1F1F1F; --ink: #EDEDED; --muted: #8E8E8E; --grid: rgba(255, 255, 255, 0.10);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper: #1A1A1A; --surface: #1F1F1F; --ink: #EDEDED; --muted: #8E8E8E; --grid: rgba(255, 255, 255, 0.10); }
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); }
  body {
    background-image: radial-gradient(var(--grid) 0.9px, transparent 1px);
    background-size: 24px 24px;
    font: 500 10px/1.2 ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: 0.11em; text-transform: uppercase; color: var(--muted);
    user-select: none; -webkit-user-select: none;
  }
  canvas { display: block; }
  .tag {
    position: fixed; padding: 3px 6px; border: 1px solid var(--muted);
    background: var(--paper); pointer-events: none;
  }
  #dims { left: 10px; bottom: 10px; color: var(--ink); border-color: var(--ink); }
  #hint { right: 10px; bottom: 10px; }
  #status { left: 50%; top: 50%; transform: translate(-50%, -50%); border-style: dashed; }
  .hidden { display: none !important; }

  /* Sim theater (replay mode) ------------------------------------------------ */
  :root { --good: #1E7F4F; --danger: #C8102E; --accent: #20A4F3; }
  body.replaying #dims { bottom: 50px; }
  body.replaying #hint { display: none; }
  #rp-head {
    position: fixed; left: 10px; top: 10px; right: 10px;
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center; pointer-events: none;
  }
  #rp-head .tag { position: static; }
  #rp-outcome { color: var(--ink); border-color: var(--ink); font-weight: 600; }
  #rp-outcome.good { color: var(--good); border-color: var(--good); }
  #rp-outcome.bad { color: var(--danger); border-color: var(--danger); }
  #rp-note { border-style: dashed; }
  #rp-joints { margin-left: auto; color: var(--muted); border-style: dashed; }
  #rp-bar {
    position: fixed; left: 10px; right: 10px; bottom: 10px; height: 28px;
    display: flex; align-items: stretch; gap: 0;
    border: 1px solid var(--ink); background: var(--paper); color: var(--ink);
  }
  #rp-bar button {
    font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--ink);
    background: transparent; border: 0; border-right: 1px solid var(--ink);
    min-width: 30px; padding: 0 8px; cursor: pointer; border-radius: 0;
  }
  #rp-bar button:hover { background: rgba(127, 127, 127, 0.12); }
  #rp-bar button:active { opacity: 0.7; }
  #rp-play { min-width: 40px; color: var(--accent) !important; }
  #rp-speed { border-left: 1px solid var(--ink) !important; border-right: 0 !important; min-width: 52px; }
  #rp-scrub-wrap { flex: 1; display: flex; align-items: center; padding: 0 10px; min-width: 60px; }
  #rp-time { display: flex; align-items: center; padding: 0 8px; white-space: nowrap; color: var(--muted);
             border-left: 1px solid var(--ink); }
  input[type=range]#rp-scrub {
    -webkit-appearance: none; appearance: none; width: 100%; height: 14px; margin: 0;
    background: transparent; cursor: pointer;
  }
  input[type=range]#rp-scrub::-webkit-slider-runnable-track { height: 1px; background: var(--ink); }
  input[type=range]#rp-scrub::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 9px; height: 9px; margin-top: -4px;
    background: var(--paper); border: 1px solid var(--accent); border-radius: 0;
  }
  input[type=range]#rp-scrub::-moz-range-track { height: 1px; background: var(--ink); }
  input[type=range]#rp-scrub::-moz-range-thumb {
    width: 9px; height: 9px; background: var(--paper); border: 1px solid var(--accent); border-radius: 0;
  }
  @media (max-width: 420px) { #rp-time, #hint, #rp-joints { display: none; } }

  /* Part legend + hover label ------------------------------------------------ */
  #legend {
    position: fixed; left: 10px; top: 10px; max-height: calc(100% - 110px); overflow-y: auto;
    display: flex; flex-direction: column; gap: 2px; padding: 5px 6px;
    border: 1px solid var(--muted); background: var(--paper); pointer-events: auto;
  }
  #legend .row { display: flex; align-items: center; gap: 6px; padding: 1px 2px; cursor: default; white-space: nowrap; }
  #legend .row:hover, #legend .row.hot { color: var(--ink); background: rgba(127, 127, 127, 0.12); }
  #legend .sw {
    position: relative; width: 9px; height: 9px; padding: 0; margin: 0; flex: none;
    border: 1px solid var(--ink); border-radius: 0; background: var(--c); cursor: pointer;
  }
  #legend .sw::after { content: ""; position: absolute; inset: -4px -3px; }   /* bigger hit area */
  #legend .sw:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
  #legend .row.off .sw { background: transparent; }
  #legend .row.off span:last-child { opacity: 0.55; }
  #legend .showall {
    font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--ink);
    background: transparent; border: 1px solid var(--ink); border-radius: 0;
    margin-top: 3px; padding: 3px 6px; cursor: pointer; text-align: center;
  }
  #legend .showall:hover { background: rgba(127, 127, 127, 0.12); }
  body.replaying #legend { display: none; }
  body.moving #legend { max-height: calc(100% - var(--mv-bottom, 96px) - 54px); }
  #hover { pointer-events: none; color: var(--ink); border-color: var(--ink); transform: translate(12px, 12px); }


  /* Motion simulator --------------------------------------------------------- */
  body.moving #dims { bottom: var(--mv-bottom, 96px); }   /* --mv-bottom: set for rigs whose sliders wrap onto more rows */
  body.moving #hint { display: none; }
  #mv-bar {
    position: fixed; left: 10px; right: 10px; bottom: 10px;
    display: flex; flex-direction: column; border: 1px solid var(--ink); background: var(--paper); color: var(--ink);
  }
  #mv-top { display: flex; align-items: stretch; height: 26px; border-bottom: 1px solid var(--ink); }
  #mv-top button {
    font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--ink);
    background: transparent; border: 0; border-right: 1px solid var(--ink);
    min-width: 30px; padding: 0 10px; cursor: pointer; border-radius: 0;
  }
  #mv-top button:hover { background: rgba(127, 127, 127, 0.12); }
  #mv-play { color: var(--accent) !important; min-width: 40px; }
  #mv-title { display: flex; align-items: center; padding: 0 10px; color: var(--muted); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; }
  #mv-text { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #mv-live { width: 6px; height: 6px; background: var(--accent); margin-right: 8px; flex: none; }
  #mv-joints { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  #mv-bar.folded #mv-joints { display: none; }
  #mv-bar.folded #mv-top { border-bottom: 0; }
  #mv-top #mv-fold { border-right: 0; border-left: 1px solid var(--ink); min-width: 30px; padding: 0 8px; }
  .mv-j { display: flex; flex-direction: column; gap: 2px; padding: 5px 10px 6px; border-right: 1px solid var(--ink); min-width: 0; }
  .mv-j:last-child, .mv-j:nth-child(4n) { border-right: 0; }
  .mv-j:nth-child(n+5) { border-top: 1px solid var(--ink); }   /* rigs with more than four sliders wrap onto more rows */
  .mv-j .lab { display: flex; justify-content: space-between; color: var(--muted); }
  .mv-j .lab b { color: var(--ink); font-weight: 600; }
  .mv-j input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 14px; margin: 0; background: transparent; cursor: pointer; }
  .mv-j input[type=range]::-webkit-slider-runnable-track { height: 1px; background: var(--ink); }
  .mv-j input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 9px; height: 9px; margin-top: -4px;
    background: var(--paper); border: 1px solid var(--accent); border-radius: 0;
  }
  @media (max-width: 420px) {
    #mv-joints { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .mv-j:nth-child(2n), .mv-j:last-child { border-right: 0; }
    .mv-j:nth-child(n+3) { border-top: 1px solid var(--ink); }
  }
  .mv-j input[type=range]:disabled, #rp-scrub:disabled { opacity: 0.4; cursor: default; }
  #mv-top button:disabled, #rp-bar button:disabled { opacity: 0.4; cursor: default; background: transparent; }

  /* Rig status tags (rigged Simulate) ------------------------------------------ */
  #rig-tags {
    position: fixed; top: 10px; right: 10px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
    max-width: min(420px, 60%); pointer-events: none;
  }
  #rig-tags .tag { position: static; border-style: dashed; }
  #rig-tags .tag.bad { color: var(--danger); border-color: var(--danger); }
  #rig-tags .tag.note { max-width: 100%; line-height: 1.35; }

  /* Exploded view ------------------------------------------------------------ */
  #ex-bar {
    position: fixed; left: 10px; right: 10px; bottom: var(--ex-bottom, 10px);
    display: flex; align-items: stretch; height: 26px;
    border: 1px solid var(--ink); background: var(--paper); color: var(--ink);
  }
  #ex-title { display: flex; align-items: center; padding: 0 10px; color: var(--muted); white-space: nowrap; border-right: 1px solid var(--ink); }
  #ex-live { width: 6px; height: 6px; background: var(--accent); margin-right: 8px; flex: none; }
  #ex-slide { flex: 1; display: flex; align-items: center; padding: 0 10px; min-width: 60px; }
  #ex-val { display: flex; align-items: center; justify-content: flex-end; min-width: 44px; padding: 0 10px; border-left: 1px solid var(--ink); }
  input[type=range]#ex-slider { -webkit-appearance: none; appearance: none; width: 100%; height: 14px; margin: 0; background: transparent; cursor: pointer; }
  input[type=range]#ex-slider::-webkit-slider-runnable-track { height: 1px; background: var(--ink); }
  input[type=range]#ex-slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 9px; height: 9px; margin-top: -4px;
    background: var(--paper); border: 1px solid var(--accent); border-radius: 0;
  }
  input[type=range]#ex-slider::-moz-range-track { height: 1px; background: var(--ink); }
  input[type=range]#ex-slider::-moz-range-thumb { width: 9px; height: 9px; background: var(--paper); border: 1px solid var(--accent); border-radius: 0; }
  body.exploding #hint { display: none; }
  body.exploding #legend { max-height: calc(100% - 150px); }
  body.exploding.moving #legend { max-height: calc(100% - var(--mv-bottom, 96px) - 134px); }
  body.exploding #dims { bottom: calc(var(--ex-bottom, 10px) + 36px) !important; }
  @media (max-width: 420px) { #ex-title { padding: 0 6px; } }
  /* Inspection HUD: toolbar, view cube, inspector, measure / section / study cards ---------- */
  :root { --hud-bg: color-mix(in srgb, var(--paper) 90%, transparent); --tint: rgba(32, 164, 243, 0.10); }
  .hud { border: 1px solid var(--ink); background: var(--hud-bg); color: var(--ink);
         -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .hud button, button.hb {
    font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--ink);
    background: transparent; border: 0; border-radius: 0; cursor: pointer; padding: 0 9px;
  }
  .hud button:hover { background: rgba(127, 127, 127, 0.12); }
  .hud button.on { background: var(--tint); color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  .hud button:disabled { opacity: 0.4; cursor: default; background: transparent; }
  .hud kbd { font: inherit; color: var(--muted); margin-left: 6px; }
  /* Corner ticks: the HUD panels' frame. */
  .ticks { position: relative; }
  .ticks::before, .ticks::after { content: ""; position: absolute; width: 7px; height: 7px; pointer-events: none; border: 0 solid var(--accent); }
  .ticks::before { left: -3px; top: -3px; border-left-width: 2px; border-top-width: 2px; }
  .ticks::after { right: -3px; bottom: -3px; border-right-width: 2px; border-bottom-width: 2px; }
  #toolbar { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); display: flex; height: 26px; z-index: 3; }
  #toolbar button { border-right: 1px solid var(--ink); white-space: nowrap; }
  #toolbar button:last-child { border-right: 0; }
  #toolbar .sep { width: 0; border-left: 1px solid var(--ink); margin-left: -1px; }
  #cards { position: fixed; top: 44px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column;
           gap: 6px; align-items: center; z-index: 3; width: min(460px, calc(100% - 420px)); min-width: 260px; }
  .card { width: 100%; box-sizing: border-box; }
  .card .ch { display: flex; align-items: stretch; height: 22px; border-bottom: 1px solid var(--ink); }
  .card .ch .ttl { display: flex; align-items: center; gap: 7px; padding: 0 8px; color: var(--muted); flex: 1; white-space: nowrap; }
  .card .ch .ttl i { width: 6px; height: 6px; background: var(--accent); display: inline-block; animation: pulse 1.6s ease-in-out infinite; }
  .card .ch button { border-left: 1px solid var(--ink); }
  .card .ch button.seg { min-width: 26px; }
  .card .cb { padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; }
  .card .hint { color: var(--muted); line-height: 1.4; text-transform: none; letter-spacing: 0.02em; font-weight: 400; font-size: 10.5px; }
  @keyframes pulse { 50% { opacity: 0.25; } }
  .mrow { display: flex; gap: 8px; align-items: baseline; }
  .mrow .k { color: var(--accent); min-width: 22px; }
  .mrow .v { color: var(--ink); font-weight: 600; flex: 1; }
  .mrow .d { color: var(--muted); }
  .mrow button { padding: 0 4px; color: var(--muted); }
  input[type=range].hr { -webkit-appearance: none; appearance: none; width: 100%; height: 14px; margin: 0; background: transparent; cursor: pointer; }
  input[type=range].hr::-webkit-slider-runnable-track { height: 1px; background: var(--ink); }
  input[type=range].hr::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 9px; height: 9px; margin-top: -4px; background: var(--paper); border: 1px solid var(--accent); border-radius: 0; }
  .ramp { height: 8px; border: 1px solid var(--ink); background: linear-gradient(90deg, #30123b, #4686fb, #1ae4b6, #a2fc3c, #fabb39, #e4460a, #7a0403); }
  .ramp-l { display: flex; justify-content: space-between; color: var(--muted); }
  .swatches { display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .swatches span { display: inline-flex; align-items: center; gap: 5px; }
  .swatches b { width: 9px; height: 9px; border: 1px solid var(--ink); display: inline-block; }
  /* View cube */
  #cube-wrap { position: fixed; top: 10px; right: 10px; width: 104px; z-index: 3; display: flex; flex-direction: column; align-items: stretch; gap: 4px; }
  #cube { width: 104px; height: 104px; cursor: pointer; }
  #cube-btns { display: flex; height: 20px; }
  #cube-btns button { flex: 1; padding: 0; border-right: 1px solid var(--ink); }
  #cube-btns button:last-child { border-right: 0; }
  #rig-tags { right: 272px; top: 10px; max-width: min(300px, calc(100% - 640px)); }   /* left of the cube + inspector */
  /* Inspector */
  #insp { position: fixed; right: 10px; top: 152px; width: 252px; max-height: calc(100% - 200px); overflow-y: auto; z-index: 3; }
  body.moving #insp { max-height: calc(100% - var(--mv-bottom, 96px) - 160px); }
  body.exploding #insp { max-height: calc(100% - 236px); }
  #insp .ih { padding: 7px 8px 6px; border-bottom: 1px solid var(--ink); display: flex; gap: 6px; align-items: flex-start; }
  #insp .ih .nm { color: var(--ink); font-weight: 700; font-size: 11px; line-height: 1.25; flex: 1; word-break: break-word; }
  #insp .ih .sub { color: var(--muted); margin-top: 3px; }
  #insp .ih button { padding: 0 3px; color: var(--muted); }
  #insp dl { display: grid; grid-template-columns: 74px 1fr; gap: 3px 8px; margin: 0; padding: 7px 8px; }
  #insp dt { color: var(--muted); }
  #insp dt.clip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #insp dd { margin: 0; color: var(--ink); text-transform: none; letter-spacing: 0.03em; overflow-wrap: anywhere; }
  #insp dd small { color: var(--muted); }
  #insp .bomlk { display: flex; gap: 8px; padding: 6px 8px 2px; align-items: flex-start; }
  #insp .bomlk img { width: 44px; height: 44px; object-fit: cover; flex: none; }
  #insp .bomlk .t { min-width: 0; flex: 1; }
  #insp .bomlk .meta { color: var(--muted); margin-top: 2px; }
  #insp .bomlk .meta.warn, #legend .lk { color: #E8A33A; }
  #legend .lk { font-size: 9px; margin-left: 4px; }
  #legend .lk.bang { font-weight: 700; }
  #insp .sec { padding: 4px 8px; border-top: 1px solid var(--ink); color: var(--accent); background: var(--tint); }
  #insp .bar { height: 3px; background: rgba(127, 127, 127, 0.25); margin-top: 3px; }
  #insp .bar i { display: block; height: 100%; background: var(--accent); }
  #insp .acts { display: flex; border-top: 1px solid var(--ink); height: 24px; }
  #insp .acts button { flex: 1; padding: 0; border-right: 1px solid var(--ink); }
  #insp .acts button:last-child { border-right: 0; }
  #insp .bad { color: var(--danger); }
  #insp .good { color: var(--good); }
  .mlabel { position: fixed; transform: translate(-50%, -50%); padding: 2px 5px; pointer-events: none; z-index: 2;
            color: var(--accent); border: 1px solid var(--accent); background: var(--hud-bg); font-weight: 600; white-space: nowrap; }
  .mlabel.pending { border-style: dashed; }
  body.measuring canvas { cursor: crosshair; }
  body.replaying #toolbar, body.replaying #cards, body.replaying #insp { display: none; }
  /* Narrow panels (the app's CAD tile): toolbar top-left, cards under it in place of the legend,
     a smaller cube, and the inspector as a narrow column (a bottom sheet on the narrowest). */
  @media (max-width: 900px) {
    #toolbar kbd { display: none; }
    #toolbar { left: 10px; transform: none; }
    #toolbar button { padding: 0 7px; }
    #cards { left: 10px; transform: none; width: min(360px, calc(100% - 250px)); min-width: 220px; }
    body:has(#toolbar:not(.hidden)) #legend { top: 44px; max-height: calc(100% - 140px); }
    body:has(#cards > .card:not(.hidden)) #legend { display: none; }
    #insp { width: 214px; }

<script type="module">

const dark = window.matchMedia('(prefers-color-scheme: dark)');
let themeMode = (window.__mechyTheme === 'light' || window.__mechyTheme === 'dark') ? window.__mechyTheme : 'system';

  : { paper: 0xECECEA, surface: 0xF5F5F3, ink: 0x1C1C1C, muted: 0x6B6B6B, grid: 0xCFCFCC, gridMajor: 0xA8A8A4, accent: 0x20A4F3 };

// Renderer / scene ------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);

const perspCam = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.001, 1000);
perspCam.position.set(1.2, 0.9, 1.4);
const orthoCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.001, 1000);

let rafId = 0;         // pending requestAnimationFrame, 0 when the loop is idle

  if (renderFrames < frames) renderFrames = frames;

  new THREE.ShadowMaterial({ opacity: 0.12 })

  if (grid) { scene.remove(grid); grid.geometry.dispose(); grid.material.dispose(); }

let model = null;
let shaded = false;
const loader = new GLTFLoader();

function niceStep(x) {
  const e = Math.pow(10, Math.floor(Math.log10(x)));

// Part colours by role, so the arm reads at a glance: links in two alternating Mechy blues,
// a graphite base, sand printed brackets, steel fasteners, black motors and servos,

// neighbours stay distinct. Bought parts of one kind (motors, pulleys, hardware) share one
// legend row so they read as "the same thing".
const ROLES = [
  { role: 'virtual', re: /keep-?out|envelope|clearance|workspace/i, color: 0xBFC3C8, rough: 0.8, metal: 0, opacity: 0.16 },
  { role: 'belt', re: /belt/i, color: 0x26282B, rough: 0.9, metal: 0 },
  { role: 'pulley', re: /pulley|gear|sprocket/i, color: 0xD3A13C, rough: 0.32, metal: 0.75 },   // before motors: "pulley_base_motor"
  { role: 'motor', re: /motor|nema|stepper|servo|28byj/i, color: 0x25282D, rough: 0.38, metal: 0.5 },
  { role: 'hardware', re: /bearing|shaft|bolt|screw|nut\b|washer|\brod\b|rod[-_]|pin\b|standoff|shim|insert/i, color: 0xA0A7B1, rough: 0.28, metal: 0.9 },
  { role: 'gripper', re: /grip|finger|claw|jaw|\bcup\b|cup[-_]|hand|manipulator|effector/i, color: 0xEE7A32, rough: 0.5, metal: 0.05 },
  { role: 'electronics', re: /uno|arduino|shield|pcb|board|esp32/i, color: 0x1F6FB2, rough: 0.5, metal: 0.1 },
  { role: 'bracket', re: /bracket|mount|plate|clamp|collar|spacer|hub|carriage|cover|pack|socket|stabili|end-?stop|cap\b/i, color: 0xDCCDAE, rough: 0.55, metal: 0.04 },   // printed sand: brackets are usually PLA, not metal
  { role: 'base', re: /base|housing|shell|deck|turret|tower|table|frame|main[-_ ]?body|chassis|turntable|yaw/i, color: 0x4E545D, rough: 0.55, metal: 0.12 },
  { role: 'link', re: /./, color: 0x2F80D6, rough: 0.48, metal: 0.05 },
];
const LINK_TONES = [0x2F80D6, 0x6FB1F0];
const roleOf = (name) => ROLES.find((r) => r.re.test(name));
const KIND_COLORS = [
  { re: /pulley|gear|belt/i, color: 0xD3A13C, label: 'Pulleys' },     // before motors: "pulley_base_motor"
  { re: /motor|nema|stepper/i, color: 0x25282D, label: 'Motors' },
  { re: /bearing|shaft|bolt|screw/i, color: 0xA0A7B1, label: 'Hardware' },
];
let partList = [];   // [{key, label, color, meshes}]
let links = null;   // CAD-BOM links from the app (setLinks)
const DRIFT_TINT = 0xE8A33A, DRIFT_INTENSITY = 0.35;
const driftOf = (o) => { const l = links && linkFor(links, partName(o)); return !!(l && l.drift); };

/** A part's node name. GLTFLoader splits multi-primitive meshes into "<node>_<i>" children of a group. */
function partName(o) {
  const parent = o.parent && o.parent.name;
  if (parent && o.name && o.name.startsWith(parent + '_') && /^\d+$/.test(o.name.slice(parent.length + 1))) return parent;
