}

function renderInspector() {
  if (!model) { hud.insp.classList.add('hidden'); return; }
  hud.insp.classList.remove('hidden');
  if (sel.node && !nodes.has(sel.node.name)) sel.node = null;
  hud.insp.innerHTML = sel.wire ? (sel.wire.type === 'cable' ? cableHTML(sel.wire.cable) : compHTML(sel.wire.comp))
    : sel.node ? partHTML(sel.node) + connectionsHTML(sel.node.name) : assemblyHTML() + electronicsHTML();
  sel.info = sel.node ? { mass: sel.node.est.grams, source: sel.node.est.source, material: sel.node.material, cm3: sel.node.cm3 } : null;
}

function focusNode(n, instant) {
  const box = nodeBox(n);
  if (box.isEmpty()) return;
  const r = Math.max(box.getBoundingSphere(new THREE.Sphere()).radius, 1e-6);
  const dir = camera.position.clone().sub(controls.target).normalize();
  setView(box.getCenter(new THREE.Vector3()), dir, r / Math.sin(THREE.MathUtils.degToRad(perspCam.fov) / 2) * 1.5, !instant);
}
function isolatePart(part) { if (part) { clickSwatch(part, { altKey: true }); renderInspector(); } }
function hidePart(part) {
  if (!part) return;
  if (hiddenKeys.has(part.key)) hiddenKeys.delete(part.key); else hiddenKeys.add(part.key);
  applyVisibility();
  renderInspector();
}

hud.insp.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act],[data-node],[data-wire]');
  if (!t) return;
  if (t.dataset.node) { window.mechy.select(t.dataset.node); return; }
  if (t.dataset.wire) { window.mechy.selectWire(t.dataset.wire); return; }
  const n = sel.node;
  switch (t.dataset.act) {
    case 'close': pinPart(null); selectNode(null); break;
    case 'addbom': {
      const rows = wr.bom.filter((b) => !b.inBOM).map(({ item, qty, spec, used_for, est_unit_usd }) =>
        ({ item, qty: String(qty), spec, used_for, source: 'Mechy viewer: harness', est_unit_usd: String(est_unit_usd) }));
      if (rows.length) post({ type: 'addToBOM', rows });
      t.disabled = true; t.textContent = 'Adding…';
    } break;
    case 'openbom': post({ type: 'openBOM', component: t.dataset.component || null }); break;
    case 'openurl': if (/^https?:\/\//i.test(t.dataset.url || '')) post({ type: 'openURL', url: t.dataset.url }); break;
    case 'focus': if (n) focusNode(n); break;
    case 'isolate': if (n) isolatePart(n.part); break;
    case 'hide': if (n) hidePart(n.part); break;
    case 'cut': if (n) {
      const c = nodeBox(n).getCenter(new THREE.Vector3());
      if (!sec.on) setSection(true);
      const b = sec.box, ax = sec.axis;
      sec.t = Math.min(1, Math.max(0, (c[ax] - b.min[ax]) / Math.max(1e-9, b.max[ax] - b.min[ax])));
      updatePlane();
    } break;
  }
});

// Camera: standard views, tweening, orthographic -----------------------------------------
const VIEWS = { front: [0, 0, 1], back: [0, 0, -1], right: [1, 0, 0], left: [-1, 0, 0], top: [0, 1, 0], bottom: [0, -1, 0], iso: [1, 0.7, 1.15] };
let tw = null;

function orthoFromDistance(dist) {
  const h = dist * Math.tan(THREE.MathUtils.degToRad(perspCam.fov) / 2);
  orthoCam.top = h; orthoCam.bottom = -h; orthoCam.zoom = 1;
  orthoCam.near = dist / 100; orthoCam.far = dist * 100;
  syncOrtho();
}
function syncOrtho() {
  const a = window.innerWidth / Math.max(1, window.innerHeight);
  orthoCam.left = -orthoCam.top * a; orthoCam.right = orthoCam.top * a;
  orthoCam.updateProjectionMatrix();
}
/** Put the camera `dist` from `target` along `dir` (animated over 0.45 s, or at once). */

  perspCam.near = dist / 100; perspCam.far = dist * 100; perspCam.updateProjectionMatrix();
  if (camera === orthoCam) orthoFromDistance(dist);
  if (!animate) {
    tw = null;
    camera.position.copy(to);
    controls.target.copy(target);
    controls.update();
    return;
  }

}
const _vd0 = new THREE.Vector3(), _vd1 = new THREE.Vector3();
function tickView(dt) {

  const r = THREE.MathUtils.lerp(d0.length(), d1.length(), u);
  _vq.setFromUnitVectors(d0.normalize(), d1.normalize());
  _vqi.identity().slerp(_vq, u);
  controls.target.lerpVectors(tw.t0, tw.t1, u);
  camera.position.copy(controls.target).addScaledVector(d0.applyQuaternion(_vqi), r);
  if (u >= 1) tw = null;

  renderMeasure();
}
$('tb-select').addEventListener('click', () => setTool('select'));
$('tb-measure').addEventListener('click', () => setTool(tool === 'point' ? 'select' : 'point'));
$('tb-edge').addEventListener('click', () => setTool(tool === 'edge' ? 'select' : 'edge'));

// Studies -------------------------------------------------------------------------------------
// Mass and material maps colour whole parts. Load maps the static gravity bending moment each
// cross-section carries (inspect.js gravityMoments): where the structure works hardest holding
// itself up. It is an estimate from part masses, not FEA: no section sizes, no print strength.
const st = { mode: null, last: 'mass', mats: new Map(), samples: null, load: null, loadT: 0 };
const loadUniforms = { uAnchor: { value: new THREE.Vector3() }, uSMax: { value: 1 }, uM: { value: new Float32Array(64) } };
const MATERIAL_COLORS = { PLA: 0x4A90D9, PETG: 0xE07B39, ABS: 0x8E6BBF, ASA: 0xB65FA8, TPU: 0x2BA889, Nylon: 0xC9B458,
  Aluminium: 0xA9B3BD, Steel: 0x5D6670, 'Steel / copper (motor)': 0x34373C, 'Rubber, glass-fibre cord': 0x7A5C3E, Unknown: 0xC4C4C0 };
const familyOf = (n) => (n.material ? (KIND_MATERIAL[n.kind] && n.material === KIND_MATERIAL[n.kind].material ? n.material : materialFamily(n.material)) : 'Unknown');

function makeStudyMat() {
  const m = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
  m.userData.uLoad = { value: 0 };
  m.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, capUniforms, loadUniforms, { uLoad: m.userData.uLoad });
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vWP;')
      .replace('#include <project_vertex>', '#include <project_vertex>\nvWP = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>\nvarying vec3 vWP;\nuniform float uLoad; uniform vec3 uAnchor; uniform float uSMax; uniform float uM[64];\n${TURBO_GLSL}\n${CAP_DECL}`)
      .replace('vec4 diffuseColor = vec4( diffuse, opacity );', `vec3 base = diffuse;
        if (uLoad > 0.5) {
          float s = clamp(distance(vWP, uAnchor) / uSMax, 0.0, 1.0) * 63.0;
          int i = int(floor(s)); int j = min(i + 1, 63);
          base = pow(turbo(mix(uM[i], uM[j], fract(s))), vec3(2.2));
        }
        vec3 fn = normalize(cross(dFdx(vWP), dFdy(vWP)));
        float lit = 0.64 + 0.36 * abs(dot(fn, normalize(vec3(0.35, 0.8, 0.5))));
        vec4 diffuseColor = vec4(base * lit, opacity);`)
      .replace('#include <dithering_fragment>', '#include <dithering_fragment>\n' + CAP_CODE);
  };
  m.customProgramCacheKey = () => 'mechy-study';
  return m;
}
function studyMaterial(o) {
  if (!st.mode || !nodes.size) return null;
  const n = nodeOf(o);
  if (!n) return null;
  let m = st.mats.get(n.name);
  if (!m) { m = makeStudyMat(); st.mats.set(n.name, m); }
  m.userData.uLoad.value = st.mode === 'load' && !n.virtual ? 1 : 0;
  m.transparent = n.virtual; m.opacity = n.virtual ? 0.25 : 1;
  if (n.virtual) m.color.setHex(0xC4C4C0);
  else if (st.mode === 'mass') {
    const max = Math.max(1e-9, ...[...nodes.values()].map((x) => (!x.virtual && x.est.grams) || 0));
    if (n.est.grams) m.color.setRGB(...turbo(Math.sqrt(n.est.grams / max)), THREE.SRGBColorSpace); else m.color.setHex(0xC4C4C0);
  } else if (st.mode === 'material') m.color.setHex(MATERIAL_COLORS[familyOf(n)] || 0xC4C4C0);
  else m.color.setHex(0xffffff);
  return m;
}

/** Surface mass samples for every real part (local frames; re-posed on each update). */
function buildSamples() {
  st.samples = [];
  const meshes = [];
  for (const n of nodes.values()) {
    if (n.virtual || !n.est.grams) continue;
    const area = n.meshes.reduce((t, m) => t + m.userData.stats.area, 0);
    for (const m of n.meshes) meshes.push([m, n.est.grams * m.userData.stats.area / Math.max(area, 1e-12)]);
  }
  const per = Math.max(40, Math.floor(60000 / Math.max(1, meshes.length)));
  for (const [m, g] of meshes) st.samples.push({ mesh: m, pts: massSamples(m, g, per) });
}
function computeLoad() {
  if (!st.samples) buildSamples();
  let total = 0;
  for (const s of st.samples) total += s.pts.length / 4;
  const pts = new Float32Array(total * 4);
  const k = unitScale / 1000;   // model units -> metres
  let i = 0, minY = Infinity, maxY = -Infinity;
  for (const s of st.samples) {
    s.mesh.updateWorldMatrix(true, false);
    for (let j = 0; j < s.pts.length; j += 4) {
      _a.set(s.pts[j], s.pts[j + 1], s.pts[j + 2]).applyMatrix4(s.mesh.matrixWorld);
      pts[i] = _a.x * k; pts[i + 1] = _a.y * k; pts[i + 2] = _a.z * k; pts[i + 3] = s.pts[j + 3];
      minY = Math.min(minY, _a.y); maxY = Math.max(maxY, _a.y);
      i += 4;
    }
  }
  if (!total) { st.load = null; return; }
  // Anchor: mass centroid of the lowest 6 % (where the structure stands on the ground).
  const cut = (minY + 0.06 * (maxY - minY)) * k;
  const anc = new THREE.Vector3(); let w = 0;
  for (let j = 0; j < pts.length; j += 4) if (pts[j + 1] <= cut) { anc.x += pts[j] * pts[j + 3]; anc.z += pts[j + 2] * pts[j + 3]; w += pts[j + 3]; }
  if (w > 0) anc.set(anc.x / w, minY * k, anc.z / w);
  const r = gravityMoments(pts, anc, 64);
  st.load = r;
  loadUniforms.uAnchor.value.copy(anc).divideScalar(k);
  loadUniforms.uSMax.value = r.sMax / k;
  for (let b = 0; b < 64; b++) loadUniforms.uM.value[b] = r.peak > 0 ? r.moment[b] / r.peak : 0;
}
function renderStudyCard() {
  const body = $('st-body');
  for (const btn of $('card-study').querySelectorAll('[data-study]')) btn.classList.toggle('on', btn.dataset.study === st.mode);
  if (st.mode === 'mass') {
    const max = Math.max(0, ...[...nodes.values()].map((x) => (!x.virtual && x.est.grams) || 0));
    body.innerHTML = `<div class="ramp"></div><div class="ramp-l"><span>0 g</span><span>${max ? fmtG(max / 4) : ''}</span><span>${max ? fmtG(max) : '—'}</span></div>
      <div class="hint">Parts coloured by estimated mass (square-root scale). Grey: mass unknown.</div>`;
  } else if (st.mode === 'material') {
    const fam = new Map();
    for (const n of nodes.values()) if (!n.virtual) { const f = familyOf(n); fam.set(f, (fam.get(f) || 0) + (n.est.grams || 0)); }
    body.innerHTML = `<div class="swatches">${[...fam].sort((a, b) => b[1] - a[1]).map(([f, g]) =>
      `<span><b style="background:#${(MATERIAL_COLORS[f] || 0xC4C4C0).toString(16).padStart(6, '0')}"></b>${esc(f)}${g ? ` <small style="color:var(--muted)">${fmtG(g)}</small>` : ''}</span>`).join('')}</div>`;
  } else if (st.mode === 'load') {
    const L = st.load;
    const sf = assemblyTotals().minSF;
    body.innerHTML = L ? `<div class="ramp"></div><div class="ramp-l"><span>0</span><span>${(L.peak / 2).toFixed(2)}</span><span>${L.peak.toFixed(2)} N·m</span></div>
      <div class="mrow"><span class="k">PK</span><span class="v">${L.peak.toFixed(2)} N·m</span><span class="d">${fmtNum(L.peakS * 1000)} mm from the base</span></div>
      ${sf ? `<div class="mrow"><span class="k">SF</span><span class="v">×${sf.static.toFixed(1)}</span><span class="d">weakest motor margin · ${esc(sf.joint)} (loads.json)</span></div>` : ''}
      <div class="hint">Gravity bending moment each section carries at this pose, from part masses. An estimate, not FEA: section sizes and print strength aren't included.</div>`
      : '<div class="hint">No part masses to load the structure with.</div>';
  }
}
function setStudy(mode) {
  st.mode = mode === 'mass' || mode === 'material' || mode === 'load' ? mode : null;
  if (st.mode) st.last = st.mode;
  $('card-study').classList.toggle('hidden', !st.mode);
  $('tb-study').classList.toggle('on', !!st.mode);

for (const btn of $('card-study').querySelectorAll('[data-study]')) btn.addEventListener('click', () => setStudy(btn.dataset.study));
$('tb-study').addEventListener('click', () => setStudy(st.mode ? null : st.last));

// Lifecycle -----------------------------------------------------------------------------------
function resetInspection() {
  clearMeasure();
  disposeWiring();
  sel.node = null; sel.wire = null;
  bracket.visible = false;
  for (const m of st.mats.values()) m.dispose();
  st.mats.clear();
  st.samples = null; st.load = null;
  nodes = new Map();
}
function modelLoaded() {
  computeNodes();
  buildHarness();
  hud.toolbar.classList.remove('hidden');
  hud.cube.classList.remove('hidden');
  if (sec.on) { sec.box = null; updatePlane(); }

function placeLabel(el, p) {
  const s = toScreen(p);
  const off = s[2] > 1 || s[2] < -1;
  el.style.display = off ? 'none' : '';
  if (!off) { el.style.left = s[0] + 'px'; el.style.top = s[1] + 'px'; }
}
const inspRefresh = { load: { at: 0, timer: 0 }, insp: { at: 0, timer: 0 } };
/** Run `fn` at most every `ms`. A call inside the wait asks for one more frame when the wait is
 *  over, so the last pose before the view goes idle is still picked up. */
function throttled(slot, ms, fn) {
  const wait = ms - (performance.now() - slot.at);
  if (wait <= 0) {
    slot.at = performance.now();
    if (slot.timer) { clearTimeout(slot.timer); slot.timer = 0; }
    fn();
  } else if (!slot.timer) {
    slot.timer = setTimeout(() => { slot.timer = 0; invalidate(1); }, Math.ceil(wait) + 1);
  }
}
/** Runs on drawn frames only: everything here follows the camera or the pose, which only change then. */
function tickInspection() {
  if (!model) return;
  for (const m of meas.list) placeLabel(m.label, measureAnchor(m));
  if (pendingLabel) placeLabel(pendingLabel.el, pendingLabel.anchor);
  updateBracket();
  tickWiring(false);
  // The pose can change under a study (motion, explode, replay): refresh the load map now and then.
  // (While it does, the inspector is not refreshed, as before.)
  if (st.mode === 'load' && (mv.on || ex.factor > 0 || rp.data)) {
    throttled(inspRefresh.load, 200, () => { computeLoad(); if (!pointerDown) renderStudyCard(); });
  } else if (sel.node && (mv.on || ex.factor > 0)) {
    throttled(inspRefresh.insp, 500, renderInspector);
  }
}

window.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || !model || rp.data) return;
  if (e.target && e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
  const n = sel.node;
  switch (e.key.toLowerCase()) {
    case 'escape':
      if (meas.pending) { meas.pending = null; measureHover(null); renderMeasure(); }
      else if (tool !== 'select') setTool('select');
      else if (n || sel.wire) { pinPart(null); selectNode(null); renderInspector(); }
      else if (meas.list.length) clearMeasure(), renderMeasure();
      else if (sec.on) setSection(false);
      break;
    case 'v': setTool('select'); break;
    case 'm': setTool(tool === 'point' ? 'select' : 'point'); break;
    case 'e': setTool(tool === 'edge' ? 'select' : 'edge'); break;
    case 'x': setSection(!sec.on); break;
    case 'l': setStudy(st.mode ? null : st.last); break;
    case 'w': setWiring(!wr.on); break;
    case 'o': setOrtho(camera !== orthoCam); break;
    case 'f': if (n) focusNode(n); else fit(); break;
    case 'i': if (n) isolatePart(n.part); break;
    case 'h': if (e.shiftKey) { hiddenKeys.clear(); applyVisibility(); renderInspector(); } else if (n) hidePart(n.part); break;
    case '0': viewDir(VIEWS.iso); break;
    case '1': viewDir(VIEWS.front); break;
    case '3': viewDir(VIEWS.right); break;
    case '7': viewDir(VIEWS.top); break;
    default: return;
  }
});

// Electronics layer ---------------------------------------------------------------------------
// Electrical parts the model already has (motors, servos, a controller, end stops) plus the
// ones it lacks (the Uno + CNC shield stack and the 12 V supply, placed on the floor beside
// the base), connected by cables that run from the controller across the floor, up through
// every joint on the way to their part (a service loop at each joint) and follow the pose
// live. Toggled as one layer (W); click a cable or board for its pins and connections.
const wr = { on: true, plan: null, group: new THREE.Group(), cables: [], comps: new Map(), key: null, lengths: {}, rigRef: undefined,
             rigBuilt: null, bom: [], hover: null };   // key: anchor positions the tubes were last built at
const _wv = new THREE.Vector3();
wr.group.name = 'mechy_wiring';
scene.add(wr.group);
const MMU = (mm) => mm / unitScale;   // millimetres -> model units

/** Joints (root first) between a node and the ground: joints.yaml when the app sent one, else the arm's joint nodes. */
function chainOf(n) {
  const joints = rg.stored && Array.isArray(rg.stored.joints) ? rg.stored.joints : null;
  if (joints) {
    const key = (s) => THREE.PropertyBinding.sanitizeNodeName(String(s));
    const own = joints.find((j) => Array.isArray(j.parts) && j.parts.some((p) => key(p) === n.name || String(p) === n.name));
    const out = [];
    for (let j = own, guard = 0; j && guard < 32; guard++) { out.unshift({ joint: j }); j = joints.find((x) => x.id === j.parent); }
    return out;
  }
  const out = [];
  for (let o = n.meshes[0]; o && o !== model; o = o.parent) if (JOINT_NODES.includes(o.name)) out.unshift({ node: o });
  return out;
}

/** Where a cable crosses a joint: on the axis, beside the link (axis offset), riding the moving side. */
function jointAnchor(el, lane) {
  const root = model.getObjectByName('assembly') || model;
  if (el.joint) {
    const j = el.joint;
    const axis = new THREE.Vector3(...(Array.isArray(j.axis) ? j.axis : [0, 0, 1])).normalize();
    const origin = new THREE.Vector3(...(Array.isArray(j.origin) ? j.origin : [0, 0, 0])).multiplyScalar(0.001);
    // Half the moving body's thickness along the axis, so the cable runs beside the link.
    const axisW = axis.clone().transformDirection(root.matrixWorld);
    const box = new THREE.Box3();
    for (const p of Array.isArray(j.parts) ? j.parts : []) {
      const nd = nodes.get(THREE.PropertyBinding.sanitizeNodeName(String(p))) || nodes.get(String(p));
      if (nd) nodeBox(nd, _box) && box.union(_box);
    }
    const ext = box.isEmpty() ? 40 : Math.abs(box.getSize(_a).dot(axisW)) * unitScale;
    const side = (Math.min(60, Math.max(10, ext / 2 + 8)) + lane * 4) * 0.001;   // assembly frame is metres (rig.js)
    const pivot = model.getObjectByName(`mechy_joint_${j.id}`);
    return pivot ? { obj: pivot, local: axis.multiplyScalar(side), loop: true }
                 : { obj: root, local: origin.addScaledVector(axis, side), loop: true };
  }
  const ax = new THREE.Vector3(...(DEFAULT_AXES[el.node.name] || [0, 0, 1])).normalize();
  return { obj: el.node, local: ax.multiplyScalar(MMU(30 + lane * 4)), loop: true };
}
const worldOf = (a) => (a.obj ? a.obj.localToWorld(a.local.clone()) : a.local.clone());
const anchorAt = (obj, world) => ({ obj, local: obj ? obj.worldToLocal(world.clone()) : world.clone() });
/** Point on an object's (posed) bounds facing `toward`, as an anchor riding that object. */
function portOn(obj, boxW, toward, lift = 0) {
  const c = boxW.getCenter(new THREE.Vector3());
  const dir = toward.clone().sub(c); dir.y = 0;
  if (dir.lengthSq() < 1e-12) dir.set(0, 0, 1);
  const p = boxW.clampPoint(c.clone().addScaledVector(dir.normalize(), 1e6), new THREE.Vector3());
  p.y = Math.min(boxW.max.y, c.y + lift);
  return anchorAt(obj, p);
}

function disposeWiring() {
  wr.group.traverse((o) => { if (o.geometry) o.geometry.dispose(); if (o.material && o.material.dispose) o.material.dispose(); });
  wr.group.clear();
  wr.cables = []; wr.comps = new Map(); wr.key = null; wr.lengths = {}; wr.plan = null;
}
const flatMat = (color) => new THREE.MeshStandardMaterial({ color, emissive: color, roughness: 0.55 });
function outline(g) {
  g.traverse((o) => {
    if (!o.isMesh || o.userData.edgesAdded) return;
    const e = new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry, 30), new THREE.LineBasicMaterial({ color: palette().ink }));
    e.raycast = () => {}; e.userData.wireEdge = true;
    o.add(e); o.userData.edgesAdded = true;
  });
}

function buildHarness() {
  disposeWiring();
  wr.rigRef = rg.stored; wr.rigBuilt = rg.rig;
  if (!model || !nodes.size) return;
  model.updateMatrixWorld(true);
  // Ground: the lowest band of the real parts (a table keep-out is not the floor).
  const real = [...nodes.values()].filter((n) => !n.virtual);
  const all = new THREE.Box3();
  for (const n of real) all.union(nodeBox(n, _box));
  if (all.isEmpty()) return;
  const floorY = all.min.y, h = all.max.y - all.min.y;
  const baseBox = new THREE.Box3();
  for (const n of real) { nodeBox(n, _box); if (_box.min.y < floorY + 0.08 * h) baseBox.union(_box); }
  const anchor = baseBox.getCenter(new THREE.Vector3()); anchor.y = floorY;
  const baseR = Math.max(baseBox.max.x - baseBox.min.x, baseBox.max.z - baseBox.min.z) / 2;
  // Electronics go on the side away from the arm's reach.
  const reach = all.getCenter(new THREE.Vector3()).sub(anchor); reach.y = 0;
  const away = reach.lengthSq() > (0.05 * baseR) ** 2 ? reach.negate().normalize() : new THREE.Vector3(0, 0, -1);
  const across = new THREE.Vector3(-away.z, 0, away.x);

  const parts = [];
  for (const n of real) { const kind = classify(n.name); if (kind) parts.push({ name: n.name, kind, depth: chainOf(n).length }); }
  const plan = projectData.wiring && Array.isArray(projectData.wiring.cables)
    ? planFromSpec(projectData.wiring, (n) => nodes.has(n))
    : planHarness(parts);
  wr.plan = plan;
  const s = 1 / unitScale;

  // Controller and supply: the model's own, or boards placed beside the base.
  const compObj = (comp) => {
    if (comp.node) { const n = nodes.get(comp.node); return n ? { obj: n.meshes[0], box: nodeBox(n, new THREE.Box3()), node: n } : null; }
    return wr.comps.get(comp.id) || null;
  };
  const ctl = plan.components.find((c) => c.id === 'controller');
  const psu = plan.components.find((c) => c.id === 'psu');
  let ctlPos;
  if (!ctl.node) {
    const g = makeController(s, plan.drivers);
    ctlPos = anchor.clone().addScaledVector(away, baseR + MMU(70)); ctlPos.y = floorY;
    g.position.copy(ctlPos); g.lookAt(anchor.x, floorY, anchor.z);
    wr.group.add(g);
  } else {
    const n = nodes.get(ctl.node);
    ctlPos = nodeBox(n, new THREE.Box3()).getCenter(new THREE.Vector3()); ctlPos.y = floorY;
  }
  if (!psu.node) {
    const g = makePSU(s);
    // Beside a placed board; outside the base when the model's own controller sits inside it.
    const p = ctl.node ? anchor.clone().addScaledVector(away, baseR + MMU(80))
                       : ctlPos.clone().addScaledVector(across, MMU(120)).addScaledVector(away, MMU(40));
    p.y = floorY;
    g.position.copy(p); g.lookAt(ctlPos.x, floorY, ctlPos.z);
    wr.group.add(g);
  }
  wr.group.updateMatrixWorld(true);
  for (const g of wr.group.children) {
    const id = g.name.startsWith('Arduino') ? 'controller' : 'psu';
    const comp = plan.components.find((c) => c.id === id);
    g.traverse((o) => { if (o.isMesh) o.userData.harness = { type: 'comp', comp }; });
    wr.comps.set(id, { obj: g, box: new THREE.Box3().setFromObject(g) });
  }
  outline(wr.group);

  const lanes = new Map();   // per joint id: how many cables already cross it
  for (const cable of plan.cables) {
    const a = compObj(plan.components.find((c) => c.id === cable.from.comp));
    const b = compObj(plan.components.find((c) => c.id === cable.to.comp));
    if (!a || !b) continue;
    const route = [];
    const bCenter = b.box.getCenter(new THREE.Vector3());
    if (cable.kind === 'power') {
      route.push(portOn(a.obj, a.box, ctlPos, 0));
      const mid = a.box.getCenter(new THREE.Vector3()).lerp(ctlPos, 0.5); mid.y = floorY + MMU(4);
      route.push(anchorAt(null, mid));
      route.push(portOn(b.obj, b.box, a.box.getCenter(new THREE.Vector3()), MMU(6)));
    } else {
      const start = portOn(a.obj, a.box, anchor, MMU(8));
      route.push(start);
      const up = worldOf(start).add(new THREE.Vector3(0, MMU(20), 0));
      route.push(anchorAt(a.obj, up));
      const n = nodes.get(cable.to.comp);
      const chain = n ? chainOf(n) : [];
      const lane = plan.cables.indexOf(cable);
      const floor = anchor.clone().addScaledVector(away, baseR * 0.85).addScaledVector(across, MMU((lane - plan.cables.length / 2) * 5));
      floor.y = floorY + MMU(6);
      route.push(anchorAt(null, floor));
      for (const el of chain) {
        const id = el.joint ? el.joint.id : el.node.name;
        const k = lanes.get(id) || 0; lanes.set(id, k + 1);
        route.push(jointAnchor(el, k));
      }
      route.push(portOn(b.obj, b.box, worldOf(route[route.length - 1]), 0));
    }
    const mat = flatMat(cable.jacket);
    const mesh = new THREE.Mesh(new THREE.BufferGeometry(), mat);
    mesh.userData.harness = { type: 'cable', cable };
    mesh.frustumCulled = false;
    wr.group.add(mesh);
    wr.cables.push({ cable, route, mesh, loops: route.map((r, i) => (r.loop ? i : -1)).filter((i) => i >= 0) });
  }
  applyWiringStyle();
  tickWiring(true);
  wr.bom = harnessBOM(plan, wr.lengths, projectData.bom);
}

function applyWiringStyle() {
  const p = palette();
  wr.group.visible = wr.on && !!model;
  wr.group.traverse((o) => {
    if (o.isMesh && o.material && o.material.emissive) {
      o.material.emissiveIntensity = shaded ? 0.12 : 0.8;
      o.material.clippingPlanes = clipPlanes();
      o.castShadow = shaded;
    }
    if (o.userData.wireEdge) { o.material.color.setHex(p.ink); o.material.clippingPlanes = clipPlanes(); }
  });
  for (const c of wr.cables) {
    const hot = wr.hover === c.cable || (sel.wire && sel.wire.cable === c.cable);
    c.mesh.material.color.setHex(hot ? p.accent : c.cable.jacket);
    c.mesh.material.emissive.setHex(hot ? p.accent : c.cable.jacket);
  }
  $('tb-wiring').classList.toggle('on', wr.on);
  invalidate();
}

/** Re-pose the cables when anything they hang on moved. */
function tickWiring(force) {
  if (!model) return;
  if (rg.stored !== wr.rigRef || rg.rig !== wr.rigBuilt) { buildHarness(); return; }
  if (!wr.on || !wr.cables.length) return;
  // Change test on every drawn frame: the anchors' world positions to 1e-5, compared in place
  // (no per-frame vectors or key strings). Cables are only re-tubed when an anchor moved.
  let n = 0;
  for (const c of wr.cables) n += c.route.length * 3;
  let changed = !!force;
  if (!wr.key || wr.key.length !== n) { wr.key = new Float64Array(n); changed = true; }
  const sig = wr.key;
  let k = 0;
  const same = (r) => sig[k] === r || (r !== r && sig[k] !== sig[k]);   // NaN matches NaN, as the old string key did
  for (const c of wr.cables) {
    for (const a of c.route) {
      const v = a.obj ? a.obj.localToWorld(_wv.copy(a.local)) : _wv.copy(a.local);
      let r = Math.round(v.x * 1e5); if (!same(r)) { sig[k] = r; changed = true; } k++;
      r = Math.round(v.y * 1e5); if (!same(r)) { sig[k] = r; changed = true; } k++;
      r = Math.round(v.z * 1e5); if (!same(r)) { sig[k] = r; changed = true; } k++;
    }
  }
  if (!changed) return;
  const pts = wr.cables.map((c) => c.route.map(worldOf));
  wr.cables.forEach((c, i) => {
    const curve = slackCurve(pts[i], { sag: 0.05, maxSag: MMU(30), loops: c.loops });
    const len = curve.getLength();
    wr.lengths[c.cable.id] = Math.ceil(len * unitScale * 1.1 / 10) * 10;   // +10 % for slack and terminations
    const seg = Math.min(400, Math.max(24, Math.round(len * unitScale / 4)));
    c.mesh.geometry.dispose();
    c.mesh.geometry = new THREE.TubeGeometry(curve, seg, MMU(c.cable.radiusMM), 7, false);
  });
}

function setWiring(on) {
  wr.on = !!on;
  if (!wr.on && sel.wire) { sel.wire = null; renderInspector(); }
  applyWiringStyle();
  if (wr.on) tickWiring(true);
}
$('tb-wiring').addEventListener('click', () => setWiring(!wr.on));

/** First harness object under the pointer, if it is nearer than the model surface. */
function pickHarness(e, modelHit) {
  if (!wr.on || !wr.group.children.length) return null;
  _ndc.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(_ndc, camera);
  const h = raycaster.intersectObject(wr.group, true).find((x) => x.object.userData.harness && unclipped(x.point));
  if (!h || (modelHit && modelHit.distance < h.distance)) return null;
  return h.object.userData.harness;
}

const swatch = (c) => `<b style="display:inline-block;width:8px;height:8px;border:1px solid var(--ink);margin-right:5px;background:#${(WIRE[c] ?? 0x888888).toString(16).padStart(6, '0')}"></b>`;
const compLabel = (id) => { const c = wr.plan && wr.plan.components.find((x) => x.id === id); return c ? prettyName(c.label) : id; };
function cableHTML(c) {
  const len = wr.lengths[c.id];
  return `<div class="ih"><div style="flex:1"><div class="nm">${esc(c.label)}</div>
      <div class="sub">Cable · ${esc(c.gauge)} · ${c.conductors.length} conductors</div></div>
      <button data-act="close" title="Back to the assembly (Esc)">✕</button></div>
    <dl>
      ${dlRow('From', `${esc(compLabel(c.from.comp))} <small>${esc(c.from.port)}</small>`)}
      ${dlRow('To', `${esc(compLabel(c.to.comp))} <small>${esc(c.to.port)}</small>`)}
      ${dlRow('Length', len ? `${len} <small>mm cut length, routed + 10 % slack</small>` : null)}
      ${dlRow('Ends', esc(c.connector.join(' → ')))}
      ${dlRow('Logic', c.logic ? esc(c.logic) : null)}
    </dl>
    <div class="sec">Conductors</div>
    <dl>${c.conductors.map((k) => `<dt>${swatch(k.color)}${esc(k.pin)}</dt><dd>${esc(k.signal)} <small>${esc(k.color)}</small></dd>`).join('')}</dl>`;
}
function connectionsHTML(compId) {
  if (!wr.plan) return '';
  const comp = wr.plan.components.find((c) => c.id === compId);
  if (!comp) return '';
  const cables = wr.plan.cables.filter((c) => c.from.comp === compId || c.to.comp === compId);
  const rows = comp.id === 'controller'
    ? comp.pins.map((p) => `<dt>${p.color ? swatch(p.color) : ''}${esc(p.id)}</dt><dd>${esc(p.signal)}${p.peer ? ` <small>→ ${esc(compLabel(p.peer))}</small>` : ''}</dd>`).join('')
    : cables.map((c) => c.conductors.map((k) => `<dt>${swatch(k.color)}${esc(k.signal.split(' ')[0])}</dt><dd>${esc(k.signal)} <small>→ ${esc(compLabel(c.from.comp === compId ? c.to.comp : c.from.comp))} ${esc(k.pin)}</small></dd>`).join('')).join('');
  const links = cables.map((c) => `<dt class="clip" style="cursor:pointer" data-wire="${esc(c.id)}">${esc(c.gauge)}</dt><dd style="cursor:pointer" data-wire="${esc(c.id)}">${esc(c.label)}${wr.lengths[c.id] ? ` <small>${wr.lengths[c.id]} mm</small>` : ''}</dd>`).join('');
  return `<div class="sec">Pins · ${esc(comp.spec)}</div><dl>${rows || '<dt>—</dt><dd>No connections</dd>'}</dl>
    ${links ? `<div class="sec">Cables</div><dl>${links}</dl>` : ''}`;
}
function compHTML(comp) {
  return `<div class="ih"><div style="flex:1"><div class="nm">${esc(prettyName(comp.label))}</div>
      <div class="sub">Electronics · placed by the viewer (not in the GLB)</div></div>
      <button data-act="close" title="Back to the assembly (Esc)">✕</button></div>
    ${connectionsHTML(comp.id)}`;
}
function electronicsHTML() {
  if (!wr.plan) return '';
  const bom = wr.bom;
  const missing = bom.filter((b) => !b.inBOM);
  const inApp = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.mechy);
  const rows = bom.map((b) => `<dt class="clip ${b.inBOM ? 'good' : 'bad'}">${b.inBOM ? '✓ in BOM' : 'missing'}</dt><dd>${esc(b.qty)} × ${esc(b.item)}</dd>`).join('');
  return `<div class="sec">Electronics · ${wr.plan.cables.length} cables</div>
    <dl>${wr.plan.cables.map((c) => `<dt class="clip" style="cursor:pointer" data-wire="${esc(c.id)}">${esc(c.axis || c.kind)}</dt><dd style="cursor:pointer" data-wire="${esc(c.id)}">${esc(compLabel(c.to.comp))}${wr.lengths[c.id] ? ` <small>${wr.lengths[c.id]} mm</small>` : ''}</dd>`).join('')}</dl>
    ${wr.plan.notes.length ? `<dl>${wr.plan.notes.map((n) => `<dt class="bad">note</dt><dd>${esc(n)}</dd>`).join('')}</dl>` : ''}
    <div class="sec">Harness BOM</div><dl>${rows}</dl>
    ${missing.length ? `<div class="acts"><button data-act="addbom" ${inApp ? '' : 'disabled'} title="${inApp ? 'Append the missing lines to bom.csv' : 'Available in the Mechy app'}">Add ${missing.length} to BOM</button></div>` : ''}`;
}


buildCube();
renderer.domElement.addEventListener('dblclick', () => { if (tool === 'select') fit(); });
function restyle() {
  applyStyle();
  buildCube();
  restyleReplay();
  if (!model && grid) rebuildGrid(grid.userData.size || 1);
  invalidate();
}
dark.addEventListener('change', restyle);

function onResize() {
  perspCam.aspect = window.innerWidth / Math.max(1, window.innerHeight);
  perspCam.updateProjectionMatrix();
  if (camera === orthoCam) syncOrtho();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', () => {
  onResize();
  if (rg.kind === 'rig') layoutMotionBar();   // the slider grid reflows below 420 px
  if (ex.on) layoutExplodeBar();
  invalidate();   // setSize cleared the canvas
});

// Anything the user does in the page may change the picture; the handlers run right after these
// (capture phase), before the frame they ask for. Plain hover is handled in hoverAt / the legend
// rows / the view cube, which redraw only when the highlight changes.
for (const type of ['pointerdown', 'pointerup', 'wheel', 'keydown', 'keyup', 'input', 'change', 'click', 'dblclick']) {
  window.addEventListener(type, () => invalidate(), { capture: true, passive: true });
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) invalidate(); });
renderer.domElement.addEventListener('webglcontextrestored', () => invalidate());

/** True while something moves by itself, so every frame must be drawn. */
function animating() {
  if (tw || ex.anim) return true;
  if (poseLocked() || !model) return false;
  if (rp.data) return rp.playing && !rp.scrubbing && !!currentThrow();   // tickReplay
  return mv.playing && ((mv.on && !!mv.rig) || (!!rg.rig && !!rg.loop));   // tickMotion / tickRig
}

rebuildGrid(1);
const motionClock = new THREE.Clock();
function frame() {
  rafId = 0;
  if (loopIdle) { motionClock.getDelta(); replayClock.getDelta(); loopIdle = false; }   // no jump after a pause
  const dt = Math.min(motionClock.getDelta(), 0.1);
  flushHover();
  tickExplode(dt);
  tickMotion(dt);
  tickRig(dt);
  tickReplay();
  tickView(dt);
  controls.update();   // damping: its 'change' event keeps the frames coming until it settles
  if (animating()) invalidate();
  if (renderFrames > 0) {
    renderFrames--;
    // The HUD must never stop the model from drawing: report its first error and carry on.
    try { tickInspection(); } catch (e) { reportError('tickInspection', e); }
    renderer.render(scene, camera);
    try { renderCube(); } catch (e) { reportError('renderCube', e); }
  }
  if (renderFrames > 0) invalidate(0);
  if (!rafId) loopIdle = true;
}
invalidate();

setStatus('No model');
post({ type: 'ready' });
</script>
</body>
</html>
